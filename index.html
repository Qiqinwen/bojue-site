<style>
  :root {
    --ui-text: rgba(67, 60, 52, 0.90);
    --ui-text-dim: rgba(67, 60, 52, 0.45);
    --glass-bg: rgba(255, 252, 248, 0.30);
    --glass-border: rgba(67, 60, 52, 0.12);
    --chip-bg: rgba(67, 60, 52, 0.10);
    --paper-0: #ffffff;
    --paper-50: #faf9f7;          /* token "paper 50" — page background */
    --page-bg: var(--paper-50);
    --loader-surface: #ffffff;
    --loader-ink: #2b2722;
    --loader-label: rgba(43, 39, 34, 0.58);

    /* ---- Shared frosted material (navigation / project cards / plates) ---- */
    --material-bg: rgba(250, 249, 247, 0.55);
    --material-border: rgba(67, 60, 52, 0.10);
    --material-shadow: 0 10px 34px rgba(40, 35, 30, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.30);
    --material-blur: 22px;
    --material-saturate: 150%;
    --material-backdrop: blur(var(--material-blur)) saturate(var(--material-saturate));
    /* Project previews use their own semantic surface so card contrast can evolve
       independently from navigation and the other frosted materials. */
    --project-card-bg: rgba(250, 249, 247, 0.55);
    --project-media-backplate: #ffffff;
    /* Compatibility aliases for the other existing plate components. */
    --plate-bg: var(--material-bg);
    --plate-border: var(--material-border);
    --plate-blur: var(--material-blur);
    --plate-saturate: var(--material-saturate);
    --plate-chip: rgba(67, 60, 52, 0.10);
    --plate-shadow: var(--material-shadow);
    --plate-backdrop: var(--material-backdrop);

    /* ---- Spring motion (read by JS for the flip card) ---- */
    --spring-stiffness: 95;
    --spring-damping: 13;

    /* ---- Editorial design tokens (warm-themed to sit on the paper hero) ---- */
    --ff-serif: "Source Serif 4", Georgia, "Times New Roman", serif;
    --ff-sans:  "Inter", -apple-system, "Helvetica Neue", Arial, sans-serif;
    --fs-13: 0.8125rem; --fs-15: 0.9375rem; --fs-18: 1.125rem; --fs-21: 1.3125rem;
    --fs-34: 2.125rem;  --fs-44: 2.75rem;   --fs-56: 3.5rem;   --fs-72: 4.5rem;
    --fw-regular: 400;  --fw-medium: 500;   --fw-semibold: 600;
    --ls-label: 0.09em; --ls-tight: -0.01em;
    --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px;
    --sp-6: 32px; --sp-7: 48px; --sp-8: 64px; --sp-9: 96px; --sp-10: 128px;
    --radius-card: 8px; --radius-feature: 14px; --radius-round: 999px;
    --measure: 38rem; --container-max: 1280px; --gutter: clamp(20px, 5vw, 64px);
    /* semantic (warm overrides of the canonical token values) */
    --color-bg: var(--paper-50); --color-bg-subtle: var(--paper-50);
    --color-text-primary: #2b2722; --color-text-body: #57514a;
    --color-text-muted: #9a928a;  --color-border: #d6cec3;
    --font-display: var(--ff-serif); --font-body: var(--ff-sans); --font-label: var(--ff-sans);
  }
  body.mode-dark {
    --ui-text: rgba(226, 234, 244, 0.92);
    --ui-text-dim: rgba(226, 234, 244, 0.45);
    --glass-bg: rgba(255, 255, 255, 0.06);
    --glass-border: rgba(255, 255, 255, 0.16);

  html[data-theme="dark"] {

  * { box-sizing: border-box; }
  html { height: 100%; }

  /* ---- Liquid loading veil — masks WebGL warm-up ---- */
  #splash {
    position: fixed; inset: 0; z-index: 9999;
    display: grid; place-items: center;
    background: var(--loader-surface, #ffffff);
    opacity: 1;

  #splash.hide { opacity: 0; pointer-events: none; }
  #splash liquid-loader {

  liquid-loader:not(:defined) {

  liquid-loader:not(:defined) .liquid-loader-fallback-orb {
    display: block;

    aspect-ratio: 1; border-radius: 50%; background: currentColor;
    animation: loaderFallbackBreath 1.05s ease-in-out infinite alternate;
  }
  liquid-loader:not(:defined) .liquid-loader-fallback-label {

  @keyframes loaderFallbackBreath { from { opacity: 0.42; } to { opacity: 0.82; } }
  @media (prefers-reduced-motion: reduce) {
    liquid-loader:not(:defined) .liquid-loader-fallback-orb,
    liquid-loader:not(:defined) .liquid-loader-fallback-label { animation: none; opacity: 0.68; }

  canvas#fluid {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    display: block;
    z-index: 0;
    touch-action: none;
    cursor: crosshair;
  }
  /* ===== Liquid landing =====
     Two canvases mirror the Playground Liquid renderer: WebGL SDF rings below and
     the short-lived pop particles above. The legacy hero canvas stays mounted because
     the project index shares its script, but its render loop idles while this hero owns
     the viewport. */
  #landingLiquid,
  #landingPopEffects {
    position: fixed; left: 0; top: 0; width: 100%; height: 100vh; height: 100lvh;
    display: none; background: var(--page-bg);
  }
  #landingLiquid { z-index: 0; touch-action: pan-y; cursor: crosshair; }
  #landingPopEffects { z-index: 1; pointer-events: none; background: transparent; }
  body.hero-liquid #landingLiquid,
  body.hero-liquid #landingPopEffects { display: block; }
  body.hero-liquid canvas#fluid { display: none; }

  /* Résumé block — SF Mono Light, justified rows with flex-grow pill leaders. Dragging
     its bounds prolongs the leaders; landing-liquid.js springs them back on release. */
  .bio {
    position: fixed; left: 58%; top: 57%; z-index: 1;
    display: none; flex-direction: column; gap: 6px; width: 344px;
    font-family: ui-monospace, "SF Mono", "SFMono-Regular", Menlo, monospace;
    font-weight: 300; font-size: 13px; line-height: 1.25; color: var(--color-text-primary);
    pointer-events: none; user-select: none; -webkit-user-select: none;
    text-shadow: 0 1px 14px rgba(250,249,247,.6); will-change: width, transform;
    transition: opacity .45s ease, color .5s ease, text-shadow .5s ease;

  html[data-theme="dark"] .bio { text-shadow: 0 1px 14px rgba(0,0,0,.55); }
  body.hero-liquid .bio { display: flex; }
  body.scrolled .bio { opacity: 0; }
  .bio .r { display: flex; gap: 3px; align-items: center; width: 100%; }
  .bio .r span { white-space: nowrap; flex: 0 0 auto; }
  .bio .pill { flex: 1 0 0; min-width: 1px; height: 16px; border: 0.75px solid currentColor; border-radius: 99px; opacity: .9; }
  /* keep the block on-screen on narrow viewports (no cursor → parallax stays at 0) */
  @media (max-width: 760px) {
    .bio { left: clamp(16px, 7vw, 44px); top: auto; bottom: clamp(96px, 18vh, 150px); width: min(344px, 84vw); font-size: 11.5px; }

  /* The liquid renderer follows the active page theme directly. Keep the surrounding

  .debug-toggle {
    position: fixed;
    left: clamp(16px, 3vw, 40px);

    font-family: "Roboto", Arial, sans-serif;

    letter-spacing: 0.05em;
    color: var(--ui-text);
    background: var(--plate-bg);
    border: 1px solid var(--plate-border);
    border-radius: var(--radius-round);

    -webkit-backdrop-filter: var(--plate-backdrop);
  }
  .debug {
    position: fixed;
    left: clamp(16px, 3vw, 40px);

    display: none;
    z-index: 7;
    font-family: "Roboto", Arial, sans-serif;
    color: var(--ui-text);
    background: var(--plate-bg);
    border: 1px solid var(--plate-border);
    border-radius: var(--radius-feature);
    box-shadow: 0 12px 40px rgba(20, 18, 16, 0.18);

    -webkit-backdrop-filter: var(--plate-backdrop);

  .debug.open { display: block; }
  .debug-body { max-height: 62vh; overflow-y: auto; margin-right: -6px; padding-right: 6px; }
  .debug-head {

  /* ---------------- editorial type recipes (from design-tokens) ---------------- */
  .t-eyebrow {
    font: var(--fw-medium) var(--fs-13)/1.2 var(--font-label);
    letter-spacing: var(--ls-label); text-transform: uppercase;
    color: var(--color-text-muted);
  }
  .t-display-l {
    font: var(--fw-regular) clamp(var(--fs-34), 4.5vw, var(--fs-56))/1.12 var(--font-display);
    letter-spacing: var(--ls-tight); color: var(--color-text-primary);
  }
  .t-body {
    font: var(--fw-regular) var(--fs-18)/1.6 var(--font-body);
    color: var(--color-text-body);

  /* ---------------- 滚动内容:作品区(整屏分页) ---------------- */
  html { scroll-snap-type: y mandatory; }
  .page { position: relative; z-index: 1; pointer-events: none; }
  .hero-space { height: 100vh; height: 100lvh; pointer-events: none; scroll-snap-align: start; }

  .work { position: relative; pointer-events: auto; background: var(--page-bg); }
  /* 粒子 hero → 第一屏作品 的平滑渐隐过渡 */
  .work::before {
    content: "";
    position: absolute; left: 0; right: 0; top: -22vh; height: 22vh;
    /* the fade is a MASK (fixed shape), the colour is a plain background-color token —
       so it can transition at the same rate as .work / body when the hero veil flips
       (a gradient background-image can't animate, which made the scrim snap ahead). */
    background-color: var(--page-bg);
    -webkit-mask-image: linear-gradient(to bottom, transparent, #000 92%);
            mask-image: linear-gradient(to bottom, transparent, #000 92%);
    pointer-events: none;
  }
  .work-panel {
    height: 100vh;
    scroll-snap-align: start;
    display: flex; align-items: center;
  }
  .work-inner {
    width: 100%; max-width: var(--container-max);
    margin: 0 auto; padding: 0 calc(var(--gutter) + clamp(18px, 3vw, 44px)) 0 var(--gutter);
    display: grid; grid-template-columns: 1fr 1fr;
    gap: clamp(32px, 4.5vw, 80px); align-items: center;
  }
  /* 可 3D 旋转/翻面的图位卡(占位色块) */
  .work-card {
    width: 82%; justify-self: center;
    perspective: 1300px;
  }
  .work-card-inner {
    position: relative; width: 100%; aspect-ratio: 5 / 6;
    transform-style: preserve-3d;
    will-change: transform;
  }
  .work-card-inner.grabbing { cursor: grabbing; }
  /* Invoko: flip card kept, but 4:3 with a looping video playing as the front cover */
  .work-card-video .work-card-inner { aspect-ratio: 4 / 3; }
  .work-video {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block;
    /* the video is its own compositing layer — without this it bleeds through
       to the meta side when the card flips (ignores the face's backface-hidden) */
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
  }

  /* ===== Microsoft: WebGL liquid-glass composition =====
     A single canvas renders the 3 image layers (parallax) + the 1980 logo as a
     real refracting glass lens (see initMsGlass). Aspect matches the test rig. */
  /* The visible footprint stays 1000/760, but the canvas BUFFER (and CSS box) is
     oversized ~12% and allowed to overflow, so the parallax-shifted layers always
     have margin and never hit the raster edge. */
  .work-ms { position: relative; width: 100%; aspect-ratio: 1000 / 760; overflow: visible; }
  .ms-canvas {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 112%; height: 112%; display: block; pointer-events: none;
  }
  .work-card-face {
    position: absolute; inset: 0; overflow: hidden;
    border-radius: var(--radius-feature);
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    box-shadow: 0 34px 80px rgba(40, 35, 30, 0.18);
  }
  .work-card-front { background: linear-gradient(150deg, #cdd1d6, #aeb4bd); }
  .work-panel:nth-child(1) .work-card-front { background: linear-gradient(150deg, #d6d2cb, #b3a89a); }
  .work-panel:nth-child(2) .work-card-front { background: linear-gradient(150deg, #cdd6df, #aebdcd); }
  .work-panel:nth-child(3) .work-card-front { background: linear-gradient(150deg, #d0d2c9, #aeb3a3); }
  .work-panel:nth-child(4) .work-card-front { background: linear-gradient(150deg, #d9cfcb, #b6a59c); }
  .work-panel:nth-child(5) .work-card-front { background: linear-gradient(150deg, #cfcdd6, #a9a6bd); }
  .work-panel:nth-child(6) .work-card-front { background: linear-gradient(150deg, #d3d6d2, #a8b1a6); }
  /* 光标移动时的柔和打光 */
  .work-card-sheen {
    position: absolute; inset: 0; pointer-events: none; opacity: 0;
    transition: opacity 0.35s ease;
    background: radial-gradient(circle at var(--mx, 50%) var(--my, 35%),
      rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0.0) 55%);
    mix-blend-mode: soft-light;
  }
  .work-card:hover .work-card-sheen { opacity: 1; }
  /* 背面:项目元信息 */
  .work-card-back {
    transform: rotateY(180deg);
    background: #36302a; color: #ece6df;
    display: flex; flex-direction: column; justify-content: center;
    padding: clamp(22px, 3vw, 40px);
  }
  .work-card-back .t-eyebrow { color: rgba(236, 230, 223, 0.55); margin-bottom: var(--sp-5); }
  .card-meta { margin: 0; display: grid; gap: var(--sp-4); }
  .card-meta > div { display: flex; justify-content: space-between; align-items: baseline;
    gap: var(--sp-4); padding-bottom: var(--sp-3); border-bottom: 1px solid rgba(236, 230, 223, 0.14); }
  .card-meta dt { font: var(--fw-regular) var(--fs-13)/1.3 var(--font-label);
    letter-spacing: var(--ls-label); text-transform: uppercase; color: rgba(236, 230, 223, 0.5); margin: 0; }
  .card-meta dd { margin: 0; font: var(--fw-regular) var(--fs-18)/1.3 var(--font-display); color: #ece6df; }
  .work-card-hint { margin-top: var(--sp-6); font: var(--fw-regular) var(--fs-13)/1.4 var(--font-body); color: rgba(236, 230, 223, 0.45); }

  .work-info { max-width: var(--measure); }
  .work-info .t-eyebrow { margin-bottom: var(--sp-5); }
  .work-title { margin: 0; }
  .work-title a {
    position: relative; display: inline-block;
    color: inherit; text-decoration: none;
  }
  .work-title a::after {
    content: ""; position: absolute; left: 0; bottom: -0.12em;
    width: 100%; height: 2px; background: currentColor;
    transform: scaleX(0); transform-origin: left;
    transition: transform 0.5s cubic-bezier(0.19, 1, 0.22, 1);
  }
  .work-title a:hover::after { transform: scaleX(1); }
  .work-desc { margin: var(--sp-6) 0 0; }

  /* "View case study" trigger — sits under the description, opens the window */
  .work-open {
    margin-top: var(--sp-6);
    display: inline-flex; align-items: center; gap: 0.5em;
    padding: 10px 18px;
    font: var(--fw-medium) var(--fs-13)/1 var(--font-label);
    letter-spacing: 0.04em;
    color: var(--color-text-primary);
    background: var(--plate-chip);
    border: 1px solid var(--plate-border);
    border-radius: var(--radius-round);
    cursor: pointer;
    text-decoration: none;
    transition: background 0.25s ease, transform 0.25s ease;
  }
  .work-open:hover { background: rgba(67, 60, 52, 0.16); }
  .work-open:active { transform: scale(0.97); }
  .work-open span { transition: transform 0.3s cubic-bezier(0.19, 1, 0.22, 1); }
  .work-open:hover span { transform: translateX(4px); }

  /* ============================================================
   *  CASE-STUDY WINDOW — one active project
   *  Project tabs sit above a single reusable window. Only the selected
   *  case is loaded, so sibling projects do not render behind it.
   * ============================================================ */
  .case-modal {
    position: fixed; inset: 0; z-index: 80;
    display: none; align-items: center; justify-content: center;
    padding: clamp(12px, 3vw, 40px);
  }
  .case-modal.open { display: flex; }
  .case-backdrop {
    position: absolute; inset: 0;
    background: rgba(28, 24, 20, 0.42);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    opacity: 0; transition: opacity 0.4s ease;
  }
  .case-modal.show .case-backdrop { opacity: 1; }

  /* column wrapper: tabs on top, then the active project window */
  .case-shell {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: flex-start;
    width: min(1180px, 100%); height: min(92vh, 100%);
    opacity: 0; transform: translateY(18px) scale(0.985);
    transition: opacity 0.45s ease, transform 0.55s cubic-bezier(0.19, 1, 0.22, 1);
  }
  .case-modal.show .case-shell { opacity: 1; transform: none; }

  /* project tabs (no hover lift) */
  .case-tabs {
    flex: none; display: flex; gap: 8px; margin: 0 0 14px;
    max-width: 100%; overflow-x: auto; scrollbar-width: none;
  }
  .case-tabs::-webkit-scrollbar { display: none; }
  .case-tab {
    flex: none; border: 1px solid var(--plate-border); cursor: pointer;
    padding: 9px 18px; border-radius: var(--radius-round);
    background: rgba(250, 249, 247, 0.92); color: var(--color-text-primary);
    font: var(--fw-medium) var(--fs-15)/1 var(--font-label);
    letter-spacing: var(--ls-tight); white-space: nowrap;
    box-shadow: 0 3px 10px rgba(28, 24, 20, 0.12);
    transition: background 0.3s ease, color 0.3s ease;
  }
  .case-tab.active { background: #1b1814; color: #fff; border-color: transparent; }
  /* Dark theme: tabs are window chrome (the landing is themed), so they invert —
     inactive = subtle pill on the dark header, active = a bright chip that reads as
     selected. (The light defaults above were hardcoded and went invisible in dark.) */
  html[data-theme="dark"] .case-tab {
    background: rgba(255, 255, 255, 0.07);
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.38);
  }
  html[data-theme="dark"] .case-tab.active { background: #f2ede6; color: #1b1814; }

  /* deck holds one reusable project window */
  .case-deck { position: relative; flex: 1 1 auto; width: 100%; min-height: 0; }
  .case-track {
    position: absolute; inset: 0;
    opacity: 1; transition: opacity 0.18s ease;
  }
  .case-track.switching { opacity: 0; }
  /* the active case is a self-contained window */
  .case-card {
    --hdr-veil: 255, 255, 255; --hdr-ink: #2b2722; --hdr-track: rgba(67, 60, 52, 0.12);
    position: absolute; inset: 0;
    background: var(--loader-surface);
    border: 1px solid color-mix(in srgb, var(--plate-border) 30%, transparent);
    border-radius: 28px;
    box-shadow: 0 30px 90px rgba(30, 25, 20, 0.34);
    overflow: hidden;
  }
  .case-card.dark-content { --hdr-veil: 0, 0, 0; --hdr-ink: #f5f2ec; --hdr-track: rgba(255, 255, 255, 0.16); }
  .case-card .card-grad {
    position: absolute; inset: 0; z-index: 0;
    background: var(--loader-surface);
    transition: background-color 0.5s ease;
  }
  html[data-theme="dark"] .case-modal[data-loading="1"] .case-card {
    --hdr-veil: 0, 0, 0; --hdr-ink: #f5f2ec; --hdr-track: rgba(255, 255, 255, 0.16);
  }
  /* darker tint while the window is being resized */
  .case-card::after {
    content: ''; position: absolute; inset: 0; z-index: 5; pointer-events: none;
    background: rgba(22, 19, 15, 0); transition: background 0.2s ease;
  }
  .case-modal.resizing .case-card::after { background: rgba(22, 19, 15, 0.14); }
  .case-card iframe {
    position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; z-index: 1;
    opacity: 0; transition: opacity 0.4s ease;
  }
  .case-card iframe.ready { opacity: 1; }
  .case-controls {
    position: absolute; top: 12px; left: 0; right: 0; z-index: 3;
    display: flex; align-items: center; justify-content: flex-end; gap: var(--sp-2);
    padding: 0 clamp(14px, 2vw, 22px); pointer-events: none;
  }
  .case-controls > * { pointer-events: auto; }
  .case-close, .case-expand {
    flex: none; width: 34px; height: 34px; border: 0; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent; border-radius: var(--radius-round);
    font-size: 22px; line-height: 1; color: var(--hdr-ink);
    transition: background 0.2s ease;
  }
  .case-close:hover, .case-expand:hover { background: var(--hdr-track); }
  .case-expand svg { width: 16px; height: 16px; display: block; }
  .case-close svg { width: 15px; height: 15px; display: block; }
  .case-expand .ico-compress { display: none; }
  .case-modal.fs .case-expand .ico-expand { display: none; }
  .case-modal.fs .case-expand .ico-compress { display: block; }

  /* loader over the active window */
  .case-loader {
    position: absolute; inset: 0; z-index: 4; display: flex;
    align-items: center; justify-content: center;
    border-radius: 28px;
    overflow: hidden;
    color: var(--loader-ink);
    background: var(--loader-surface);
    transition: color 0.5s ease, background-color 0.5s ease;
    pointer-events: none;
  }
  .case-loader liquid-loader {
    width: min(58vw, 220px);
    --liquid-loader-label-color: var(--loader-label);
    --liquid-loader-fallback-size: 54px;
  }
  .case-modal[data-loading="0"] .case-loader { display: none; }

  /* resize handles sit just outside the window.
     approach (anywhere in the zone) = light bar; hover near the bar = solid;
     dragging = window tint (above) + the bar shrinks vertically with smooth motion. */
  .case-resize {
    position: absolute; top: 0; bottom: 0; width: 54px; z-index: 6;
    display: flex; align-items: center; cursor: ew-resize; touch-action: none;
  }
  .case-resize.left  { right: 100%; justify-content: flex-end; }
  .case-resize.right { left: 100%; justify-content: flex-start; }
  .case-resize .rz-hit { display: flex; align-items: center; justify-content: center; width: 40px; height: 100%; }
  .case-deck.busy iframe { pointer-events: none; }   /* don't let the iframe steal the drag */
  .case-resize .rz-bar {
    width: 5px; height: 56px; border-radius: 999px;
    background: rgba(40, 35, 30, 0.55); box-shadow: 0 1px 5px rgba(0, 0, 0, 0.18);
    opacity: 0;
    transition: opacity 0.25s ease, height 0.35s cubic-bezier(0.19, 1, 0.22, 1), background 0.2s ease;
  }
  .case-resize:hover .rz-bar { opacity: 0.4; }            /* approach: light */
  .case-resize .rz-hit:hover .rz-bar { opacity: 1; }      /* hover near bar: solid */
  .case-modal.resizing .rz-bar { opacity: 1; height: 34px; }  /* drag: shrink */

  /* Fullscreen: the active card fills the viewport and tabs hide.
     !important overrides any inline width left by a horizontal resize, while
     still restoring that width once fullscreen is exited. */
  .case-modal.fs { padding: 0; }
  .case-modal.fs .case-shell { width: 100% !important; height: 100% !important; }
  .case-modal.fs .case-tabs { display: none; }
  .case-modal.fs .case-card,
  .case-modal.fs .case-loader { border-radius: 0; }
  .case-modal.fs .case-resize { display: none; }

  @media (max-width: 700px) {
    .case-controls { gap: var(--sp-2); }
    .case-resize { display: none; }
    /* mobile = fullscreen, no tabs — just the dismiss button */
    .case-modal.fs .case-expand { display: none; }
  }

  /* 右侧整屏分页圆点 */
  .work-dots {
    position: fixed; right: clamp(18px, 3vw, 44px); top: 50%;
    transform: translateY(-50%);
    display: flex; flex-direction: column; gap: var(--sp-5);
    z-index: 30; opacity: 0; pointer-events: none;
    transition: opacity 0.5s ease;
  }
  .work-dots.show { opacity: 1; pointer-events: auto; }
  .work-dot {
    width: 7px; height: 7px; padding: 0; border: 0; cursor: pointer;
    border-radius: var(--radius-round);
    background: var(--color-text-primary); opacity: 0.3;
    position: relative; transition: opacity 0.3s ease;
  }
  .work-dot.active { opacity: 1; }
  .work-dot.active::after {
    content: ""; position: absolute; inset: -6px;
    border: 1px solid var(--color-text-primary); border-radius: var(--radius-round);
  }

  @media (max-width: 900px) {
    .work-inner { grid-template-columns: 1fr; gap: clamp(24px, 5vh, 48px); justify-items: start; }
    .work-card { width: min(58%, 300px); justify-self: start; }
    .work-dots { right: 14px; gap: var(--sp-4); }
  }
  /* Site footer — pinned at the very bottom: live local time + copyright. */
  .site-footer {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 clamp(22px, 4vw, 52px) clamp(13px, 1.6vw, 20px);
    font: 400 12px/1.4 "Roboto", "Helvetica Neue", Arial, sans-serif;
    letter-spacing: 0.05em; color: var(--ui-text-dim);
    pointer-events: none; opacity: 0; animation: uiIn 3.2s ease 0.9s forwards;
  }
  .site-footer__local { display: inline-flex; align-items: baseline; gap: 8px; }
  .site-footer__time { font-variant-numeric: tabular-nums; }
  @media (max-width: 640px) {
    .site-footer { font-size: 11px; padding-bottom: 12px; }
    body.hero-liquid:not(.scrolled) .site-footer { opacity: 0 !important; }
  }
  .work-card-front[style*="background-image"] { background-size: cover; background-position: center; }

  /* ============================================================
   *  DESKTOP PROJECT INDEX — one snapped page, hover previews
   *  The legacy full-page project sequence remains the mobile UI.
   * ============================================================ */
  .desktop-work-panel {
    position: relative; height: 100vh; min-height: 660px;
    scroll-snap-align: start; overflow: hidden;
  }
  .desktop-work-shell {
    position: relative; width: min(1200px, calc(100% - 80px)); height: 100%;
    margin: 0 auto;
  }
  .desktop-work-tags {
    position: absolute; left: 0; top: clamp(140px, 19vh, 230px); z-index: 5;
    display: flex; flex-wrap: wrap; gap: 10px;
  }
  .desktop-work-tag,
  .desktop-card-tag {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 34px; padding: 7px 15px;
    border: 1px solid color-mix(in srgb, var(--color-text-primary) 52%, transparent);
    border-radius: var(--radius-round); background: transparent;
    color: var(--color-text-primary);
    font: 400 14px/1 "Roboto", "Helvetica Neue", Arial, sans-serif;
    letter-spacing: 0.01em; white-space: nowrap;
  }
  .desktop-work-tag {
    cursor: pointer;
    transition: color 200ms ease-out, background-color 200ms ease-out,
                border-color 200ms ease-out, border-width 200ms ease-out,
                padding 200ms ease-out;
  }
  .desktop-work-tag:hover { border-width: 2px; padding: 6px 14px; }
  .desktop-work-tag[aria-pressed="true"] {
    color: var(--color-bg); background: var(--color-text-primary);
    border-color: var(--color-text-primary);
  }
  .desktop-project-list {
    position: absolute; left: 0; top: 45%; z-index: 4;
    display: flex; flex-direction: column; align-items: flex-start;
    gap: clamp(12px, 1.25vh, 18px); margin: 0; padding: 0; list-style: none;
  }
  .desktop-project-row { display: block; }
  .desktop-project-row[hidden] { display: none; }
  .desktop-project-title {
    position: relative; display: inline-grid; grid-template-areas: "title";
    margin: 0; padding: 0 .24em 0 0; border: 0; background: none;
    overflow: visible;
    color: var(--color-text-primary); cursor: pointer;
    font: 300 clamp(38px, 3.1vw, 58px)/1 "Noto Sans", "Helvetica Neue", Arial, sans-serif;
    font-synthesis: none;
    letter-spacing: -0.035em; text-align: left;
    text-decoration: none;
    transition: opacity .22s ease;
  }
  .desktop-project-title-face {
    grid-area: title; white-space: nowrap; pointer-events: none;
  }
  .desktop-project-title-face--rest {
    transition: font-weight .22s ease;
  }
  .desktop-project-title-face--active {
    visibility: hidden; font-weight: 500; font-style: italic;
  }
  .desktop-project-list:has(.desktop-project-title:hover) .desktop-project-title:not(:hover),
  .desktop-project-list:has(.desktop-project-title:focus-visible) .desktop-project-title:not(:focus-visible) {
    opacity: .5;
  }
  .desktop-project-title:hover,
  .desktop-project-title:focus-visible,
  .desktop-project-title.is-active {
    opacity: 1; outline: none;
  }
  .desktop-project-title:hover .desktop-project-title-face--rest,
  .desktop-project-title:focus-visible .desktop-project-title-face--rest,
  .desktop-project-title.is-active .desktop-project-title-face--rest {
    font-weight: 500; font-style: italic;
  }
  .desktop-project-title:focus-visible::after {
    content: ""; position: absolute; left: 0; right: .24em; bottom: -5px;
    height: 2px; border-radius: 2px; background: currentColor;
  }

  .desktop-preview-layer { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
  .desktop-rope {
    position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible;
    color: var(--color-text-primary); opacity: 0;
    transition: opacity .18s ease;
  }
  .desktop-rope.is-visible { opacity: 1; }
  .desktop-rope path {
    fill: none; stroke: currentColor; stroke-width: 1.35;
    vector-effect: non-scaling-stroke;
  }
  .desktop-rope circle { fill: currentColor; }

  .desktop-project-card {
    --outer-radius: 30px; --card-pad: 9px; --inner-radius: 21px;
    position: absolute; right: 0; top: 50%; z-index: 3;
    display: flex; padding: var(--card-pad);
    border: 1px solid var(--material-border);
    border-radius: var(--outer-radius); background: var(--project-card-bg);
    box-shadow: var(--material-shadow);
    backdrop-filter: var(--material-backdrop);
    -webkit-backdrop-filter: var(--material-backdrop);
    opacity: 0; visibility: hidden; pointer-events: none;
    transform: translateY(-46%) scale(.965) rotate(.35deg);
    transform-origin: 8% 50%;
    transition: opacity .18s ease, visibility 0s linear .24s,
                transform .58s cubic-bezier(.16,1.08,.28,1);
    will-change: transform, opacity;
    color: inherit; text-decoration: none;
  }
  .desktop-project-card.is-active {
    opacity: 1; visibility: visible; pointer-events: auto;
    transform: translateY(-50%) scale(1) rotate(0deg);
    transition-delay: 0s;
  }
  .desktop-project-card.is-horizontal {
    width: clamp(600px, 37vw, 720px); aspect-ratio: 1.76 / 1;
    flex-direction: row;
  }
  .desktop-project-card.is-vertical {
    width: clamp(320px, 19vw, 378px); min-height: 456px;
    flex-direction: column;
  }
  .desktop-card-media {
    position: relative; flex: none; overflow: hidden;
    border: 1px solid var(--material-border);
    border-radius: var(--inner-radius); background-color: #dedede;
    background-clip: padding-box;
  }
  .is-horizontal .desktop-card-media { width: 46%; height: 100%; }
  .is-vertical .desktop-card-media { width: 100%; aspect-ratio: 1.42 / 1; }
  .desktop-card-media img,
  .desktop-card-media video {
    position: absolute; inset: 0; display: block;
    width: 100%; height: 100%; object-fit: cover;
  }
  .desktop-project-card[data-project="microsoft"] .desktop-card-media { background-color: var(--project-media-backplate); }
  .desktop-project-card[data-project="microsoft"] .desktop-card-media video { object-fit: contain; }
  .desktop-card-media--phone {
    display: grid; place-items: center;
    background-color: var(--project-media-backplate);
  }
  .desktop-card-phone-fit {
    position: absolute; left: 50%; top: 50%;
    height: 92%; aspect-ratio: 1350 / 2760;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .desktop-card-phone-fit phone-mockup {
    position: relative; display: block;
    width: 100%; height: 100%; aspect-ratio: 1350 / 2760;
    --phone-shadow: drop-shadow(0 14px 16px rgba(0,0,0,.14)) drop-shadow(0 4px 6px rgba(0,0,0,.10));
  }
  .phone-mockup-fallback {
    position: absolute; inset: 0; display: block;
    filter: var(--phone-shadow);
  }
  .phone-mockup-fallback-screen {
    position: absolute; left: 5.3333333333%; top: 2.5%;
    width: 89.3333333333%; height: 95%; overflow: hidden;
    border-radius: 15.5887230514% / 7.1700991609%;
    background: #000; transform: translateZ(0);
  }
  .phone-mockup-fallback-screen video {
    position: static; display: block; width: 100%; height: 100%; object-fit: cover;
  }
  .phone-mockup-fallback-frame {
    position: absolute; inset: 0; z-index: 1;
    display: block; width: 100%; height: 100%; object-fit: contain;
    pointer-events: none; user-select: none; -webkit-user-drag: none;
  }
  .desktop-project-card[data-project="dim"] .desktop-card-media video { object-position: center center; }
  .desktop-card-media.is-empty {
    background:
      radial-gradient(circle at 34% 26%, rgba(255,255,255,.9), transparent 31%),
      linear-gradient(145deg, #e9e7e3, #d4d1cc);
  }
  .desktop-card-copy {
    min-width: 0; display: flex; flex: 1; flex-direction: column;
    justify-content: space-between;
    padding: clamp(18px, 2vw, 30px) clamp(15px, 1.7vw, 24px) clamp(15px, 1.7vw, 24px);
  }
  .is-vertical .desktop-card-copy { gap: 20px; padding: 22px 6px 4px; }
  .desktop-card-content {
    min-width: 0; display: flex; flex-direction: column;
    gap: clamp(30px, 3.2vw, 52px);
  }
  .desktop-card-icon {
    display: block; width: clamp(52px, 4vw, 64px); height: auto;
    flex: none;
  }
  .desktop-card-icon--dark { display: none; }
  html[data-theme="dark"] .desktop-card-icon--light { display: none; }
  html[data-theme="dark"] .desktop-card-icon--dark { display: block; }
  .desktop-card-description {
    margin: 0; color: var(--color-text-body);
    font: 400 clamp(14px, 1vw, 17px)/1.38 "Roboto", "Helvetica Neue", Arial, sans-serif;
    letter-spacing: -.012em;
  }
  .desktop-card-tags { display: flex; flex-wrap: wrap; gap: 8px; }

<script>
  (function () {
    var bootAt = performance.now();
    var minimumVisible = 450;
    var removalTimer = 0;
    var dismissed = false;
    window.__splashBootAt = bootAt;
    window.__dismissSplash = function (options) {
      if (dismissed) return;
      var force = options && options.force;
      var remaining = force ? 0 : Math.max(0, minimumVisible - (performance.now() - bootAt));
      if (remaining > 4) {
        if (!removalTimer) {
          removalTimer = setTimeout(function () {
            removalTimer = 0;
            window.__dismissSplash();
          }, remaining);
        }
        return;
      }
      dismissed = true;
      clearTimeout(removalTimer);
      var s = document.getElementById('splash');
      if (!s) return;
      s.classList.add('hide');
      var remove = function () { if (s && s.parentNode) s.remove(); };
      s.addEventListener('transitionend', remove, { once: true });
      setTimeout(remove, 450);
    };
    setTimeout(function () {
      window.__dismissSplash({ force: true });
    }, 4000);
  })();
</script>
