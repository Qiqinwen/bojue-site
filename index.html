<script>
'use strict';

/* ============================================================
 *  墨 · INK — Arrival 风格水墨流体
 *  velocity/pressure 流体模拟 + 三层雾气合成:
 *    背景雾(fbm) → 墨后雾霭(模糊深层) → 浓墨 → 墨前雾纱
 * ============================================================ */

const canvas = document.getElementById('fluid');

const config = {
  SIM_RESOLUTION: 160,        // 速度场分辨率
  DYE_RESOLUTION: 640,        // 墨水场分辨率
  PRESSURE_ITERATIONS: 20,
  CURL: 6,                    // 涡度强度,让墨产生卷须
  VELOCITY_DISSIPATION: 0.35,
  INK_DISSIPATION: 0.26,      // 近层浓墨消散 (~10s)
  TRACE_DISSIPATION: 1.9,     // 墨痕迅速消失 (~1.5s)
  DEEP_DISSIPATION: 0.11,     // 深层墨最慢,沉在雾里慢慢散
  INK_SINK: 0.22,             // 近层墨沉入深层的速率 (z轴向里)
  AMBIENT_FLOW: 1.4,          // 环境噪声流场强度(水下漂移感)
  DPR_CAP: 2,                  // 显示/文字按原生像素密度渲染,保持字形锐利
};

/* ---------------- Adaptive quality tiers ----------------
 * The sim/dye resolution, pressure iterations, and pixel-ratio cap are the four
 * knobs that decide GPU + CPU cost. We pick a starting tier from device hints,
 * then step DOWN at runtime if frames stay slow (see monitorPerf). This is what
 * keeps the landing smooth on weak laptops / phones without touching desktops. */
const TIERS = [
  { DYE: 640, SIM: 160, PRESSURE: 20, DPR: 2.0  },   // 0 — high (Apple Silicon / discrete)
  { DYE: 512, SIM: 128, PRESSURE: 16, DPR: 1.5  },   // 1 — mid  (older / integrated laptops)
  { DYE: 384, SIM: 110, PRESSURE: 12, DPR: 1.25 },   // 2 — low  (phones / weak GPUs)
];
let tierIndex = 0;
let inkReady = false, crystalReady = false;   // declared early: read by resize guards + applyTier

function applyTierValues(i) {
  const t = TIERS[i];
  config.DYE_RESOLUTION = t.DYE;
  config.SIM_RESOLUTION = t.SIM;
  config.PRESSURE_ITERATIONS = t.PRESSURE;
  config.DPR_CAP = t.DPR;
}

// Pre-emptive pick from cheap device hints — applied before the first frame.
(function pickInitialTier() {
  let i = 0;
  const mem = navigator.deviceMemory || 8;
  const cores = navigator.hardwareConcurrency || 8;
  const coarse = typeof matchMedia === 'function' && matchMedia('(pointer: coarse)').matches;
  const small = Math.min(window.innerWidth, window.innerHeight) < 700;
  if (coarse || small) i = 2;                  // touch / small viewport → lowest
  else if (mem <= 4 || cores <= 4) i = 1;      // memory- or core-starved laptop → mid
  if (i > 0) { tierIndex = i; applyTierValues(i); }
})();

// Runtime step-down: re-pick resolution/DPR and rebuild every size-dependent buffer.
function applyTier(i) {
  if (i <= tierIndex || i >= TIERS.length) return;
  tierIndex = i;
  applyTierValues(i);
  resizeCanvas();                          // DPR cap changed → new backing store
  if (inkReady) initFramebuffers();
  if (crystalReady) initCrystalSystem();
  buildObstacle();                         // re-renders text + rebuilds particle homes
  rebuildParticles();
}

/* ---------------- WebGL context ---------------- */

function getWebGLContext(canvas) {
  const params = { alpha: false, depth: false, stencil: false, antialias: false, preserveDrawingBuffer: false };
  let gl = canvas.getContext('webgl2', params);
  const isWebGL2 = !!gl;
  if (!isWebGL2)
    gl = canvas.getContext('webgl', params) || canvas.getContext('experimental-webgl', params);
  if (!gl) return null;

  let halfFloat;
  let supportLinearFiltering;
  if (isWebGL2) {
    gl.getExtension('EXT_color_buffer_float');
    supportLinearFiltering = true; // WebGL2: half float 线性过滤是核心特性
  } else {
    halfFloat = gl.getExtension('OES_texture_half_float');
    supportLinearFiltering = !!gl.getExtension('OES_texture_half_float_linear');
  }
  gl.clearColor(0, 0, 0, 1);

  const halfFloatTexType = isWebGL2 ? gl.HALF_FLOAT : (halfFloat && halfFloat.HALF_FLOAT_OES);
  let formatRGBA, formatRG, formatR;
  if (isWebGL2) {
    formatRGBA = getSupportedFormat(gl, gl.RGBA16F, gl.RGBA, halfFloatTexType);
    formatRG   = getSupportedFormat(gl, gl.RG16F, gl.RG, halfFloatTexType);
    formatR    = getSupportedFormat(gl, gl.R16F, gl.RED, halfFloatTexType);
  } else {
    formatRGBA = getSupportedFormat(gl, gl.RGBA, gl.RGBA, halfFloatTexType);
    formatRG   = formatRGBA;
    formatR    = formatRGBA;
  }
  return { gl, ext: { formatRGBA, formatRG, formatR, halfFloatTexType, supportLinearFiltering } };
}

function getSupportedFormat(gl, internalFormat, format, type) {
  if (!supportRenderTextureFormat(gl, internalFormat, format, type)) {
    switch (internalFormat) {
      case gl.R16F:  return getSupportedFormat(gl, gl.RG16F, gl.RG, type);
      case gl.RG16F: return getSupportedFormat(gl, gl.RGBA16F, gl.RGBA, type);
      default: return null;
    }
  }
  return { internalFormat, format };
}

function supportRenderTextureFormat(gl, internalFormat, format, type) {
  const texture = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, texture);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, internalFormat, 4, 4, 0, format, type, null);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
  const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
  gl.deleteFramebuffer(fbo);
  gl.deleteTexture(texture);
  return ok;
}

const ctx = getWebGLContext(canvas);
if (!ctx) {
  document.getElementById('nogl').style.display = 'grid';
  throw new Error('WebGL not supported');
}
const { gl, ext } = ctx;
const isWebGL2 = (typeof WebGL2RenderingContext !== 'undefined') && (gl instanceof WebGL2RenderingContext);

/* ---------------- shader utils ---------------- */

function compileShader(type, source, keywords) {
  if (keywords) {
    let kw = '';
    keywords.forEach(k => { kw += '#define ' + k + '\n'; });
    source = kw + source;
  }
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS))
    console.error(gl.getShaderInfoLog(shader));
  return shader;
}

class Program {
  constructor(vs, fsSource, keywords) {
    const fs = compileShader(gl.FRAGMENT_SHADER, fsSource, keywords);
    this.program = gl.createProgram();
    gl.attachShader(this.program, vs);
    gl.attachShader(this.program, fs);
    gl.linkProgram(this.program);
    if (!gl.getProgramParameter(this.program, gl.LINK_STATUS))
      console.error(gl.getProgramInfoLog(this.program));
    this.uniforms = {};
    const n = gl.getProgramParameter(this.program, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < n; i++) {
      const name = gl.getActiveUniform(this.program, i).name;
      this.uniforms[name] = gl.getUniformLocation(this.program, name);
    }
  }
  bind() { gl.useProgram(this.program); }
}

/* ---------------- shaders ---------------- */

const baseVertexShader = compileShader(gl.VERTEX_SHADER, `
  precision highp float;
  attribute vec2 aPosition;
  varying vec2 vUv;
  varying vec2 vL, vR, vT, vB;
  uniform vec2 texelSize;
  void main () {
    vUv = aPosition * 0.5 + 0.5;
    vL = vUv - vec2(texelSize.x, 0.0);
    vR = vUv + vec2(texelSize.x, 0.0);
    vT = vUv + vec2(0.0, texelSize.y);
    vB = vUv - vec2(0.0, texelSize.y);
    gl_Position = vec4(aPosition, 0.0, 1.0);
  }
`);

const copyShader = `
  precision mediump float;
  varying highp vec2 vUv;
  uniform sampler2D uTexture;
  void main () { gl_FragColor = texture2D(uTexture, vUv); }
`;

const splatShader = `
  precision highp float;
  varying vec2 vUv;
  uniform sampler2D uTarget;
  uniform float aspectRatio;
  uniform vec3 color;
  uniform vec2 point;
  uniform float radius;
  void main () {
    vec2 p = vUv - point.xy;
    p.x *= aspectRatio;
    vec3 splat = exp(-dot(p, p) / radius) * color;
    vec3 base = texture2D(uTarget, vUv).xyz;
    gl_FragColor = vec4(base + splat, 1.0);
  }
`;

const advectionShader = `
  precision highp float;
  varying vec2 vUv;
  uniform sampler2D uVelocity;
  uniform sampler2D uSource;
  uniform vec2 texelSize;
  uniform vec2 dyeTexelSize;
  uniform float dt;
  uniform vec3 dissipation;
  uniform float uSink;
  vec4 bilerp (sampler2D sam, vec2 uv, vec2 tsize) {
    vec2 st = uv / tsize - 0.5;
    vec2 iuv = floor(st);
    vec2 fuv = fract(st);
    vec4 a = texture2D(sam, (iuv + vec2(0.5, 0.5)) * tsize);
    vec4 b = texture2D(sam, (iuv + vec2(1.5, 0.5)) * tsize);
    vec4 c = texture2D(sam, (iuv + vec2(0.5, 1.5)) * tsize);
    vec4 d = texture2D(sam, (iuv + vec2(1.5, 1.5)) * tsize);
    return mix(mix(a, b, fuv.x), mix(c, d, fuv.x), fuv.y);
  }
  void main () {
  #ifdef MANUAL_FILTERING
    vec2 coord = vUv - dt * bilerp(uVelocity, vUv, texelSize).xy * texelSize;
    vec3 result = bilerp(uSource, coord, dyeTexelSize).xyz;
  #else
    vec2 coord = vUv - dt * texture2D(uVelocity, vUv).xy * texelSize;
    vec3 result = texture2D(uSource, coord).xyz;
  #endif
    vec3 decay = 1.0 / (1.0 + dissipation * dt);
    result *= decay;
    result.b += result.r * uSink * dt;   // 近层墨沿z轴沉入深层
    gl_FragColor = vec4(result, 1.0);
  }
`;

const divergenceShader = `
  precision mediump float;
  varying highp vec2 vUv;
  varying highp vec2 vL, vR, vT, vB;
  uniform sampler2D uVelocity;
  void main () {
    float L = texture2D(uVelocity, vL).x;
    float R = texture2D(uVelocity, vR).x;
    float T = texture2D(uVelocity, vT).y;
    float B = texture2D(uVelocity, vB).y;
    vec2 C = texture2D(uVelocity, vUv).xy;
    if (vL.x < 0.0) { L = -C.x; }
    if (vR.x > 1.0) { R = -C.x; }
    if (vT.y > 1.0) { T = -C.y; }
    if (vB.y < 0.0) { B = -C.y; }
    float div = 0.5 * (R - L + T - B);
    gl_FragColor = vec4(div, 0.0, 0.0, 1.0);
  }
`;

const curlShader = `
  precision mediump float;
  varying highp vec2 vUv;
  varying highp vec2 vL, vR, vT, vB;
  uniform sampler2D uVelocity;
  void main () {
    float L = texture2D(uVelocity, vL).y;
    float R = texture2D(uVelocity, vR).y;
    float T = texture2D(uVelocity, vT).x;
    float B = texture2D(uVelocity, vB).x;
    float vorticity = R - L - T + B;
    gl_FragColor = vec4(0.5 * vorticity, 0.0, 0.0, 1.0);
  }
`;

const vorticityShader = `
  precision highp float;
  varying vec2 vUv;
  varying vec2 vL, vR, vT, vB;
  uniform sampler2D uVelocity;
  uniform sampler2D uCurl;
  uniform float curl;
  uniform float dt;
  void main () {
    float L = texture2D(uCurl, vL).x;
    float R = texture2D(uCurl, vR).x;
    float T = texture2D(uCurl, vT).x;
    float B = texture2D(uCurl, vB).x;
    float C = texture2D(uCurl, vUv).x;
    vec2 force = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L));
    force /= length(force) + 0.0001;
    force *= curl * C;
    force.y *= -1.0;
    vec2 velocity = texture2D(uVelocity, vUv).xy;
    velocity += force * dt;
    velocity = min(max(velocity, -1000.0), 1000.0);
    gl_FragColor = vec4(velocity, 0.0, 1.0);
  }
`;

const pressureShader = `
  precision mediump float;
  varying highp vec2 vUv;
  varying highp vec2 vL, vR, vT, vB;
  uniform sampler2D uPressure;
  uniform sampler2D uDivergence;
  void main () {
    float L = texture2D(uPressure, vL).x;
    float R = texture2D(uPressure, vR).x;
    float T = texture2D(uPressure, vT).x;
    float B = texture2D(uPressure, vB).x;
    float divergence = texture2D(uDivergence, vUv).x;
    float pressure = (L + R + B + T - divergence) * 0.25;
    gl_FragColor = vec4(pressure, 0.0, 0.0, 1.0);
  }
`;

const gradientSubtractShader = `
  precision mediump float;
  varying highp vec2 vUv;
  varying highp vec2 vL, vR, vT, vB;
  uniform sampler2D uPressure;
  uniform sampler2D uVelocity;
  void main () {
    float L = texture2D(uPressure, vL).x;
    float R = texture2D(uPressure, vR).x;
    float T = texture2D(uPressure, vT).x;
    float B = texture2D(uPressure, vB).x;
    vec2 velocity = texture2D(uVelocity, vUv).xy;
    velocity.xy -= vec2(R - L, T - B);
    gl_FragColor = vec4(velocity, 0.0, 1.0);
  }
`;

const clearShader = `
  precision mediump float;
  varying highp vec2 vUv;
  uniform sampler2D uTexture;
  uniform float value;
  void main () { gl_FragColor = value * texture2D(uTexture, vUv); }
`;

// 环境流场:fbm 流函数的旋度,让墨与雾有水下漂移感
const ambientFlowShader = `
  precision highp float;
  varying vec2 vUv;
  uniform sampler2D uVelocity;
  uniform float uTime;
  uniform float uDt;
  uniform float uStrength;
  uniform float uAspect;
  float hash (vec2 p) {
    p = fract(p * vec2(127.1, 311.7));
    p += dot(p, p + 34.23);
    return fract(p.x * p.y);
  }
  float vnoise (vec2 p) {
    vec2 i = floor(p); vec2 f = fract(p);
    vec2 u = f * f * (3.0 - 2.0 * f);
    float a = hash(i);
    float b = hash(i + vec2(1.0, 0.0));
    float c = hash(i + vec2(0.0, 1.0));
    float d = hash(i + vec2(1.0, 1.0));
    return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
  }
  float fbm (vec2 p) {
    float v = 0.0; float a = 0.5;
    mat2 m = mat2(1.6, 1.2, -1.2, 1.6);
    for (int i = 0; i < 3; i++) { v += a * vnoise(p); p = m * p; a *= 0.5; }
    return v;
  }
  void main () {
    vec2 p = vec2(vUv.x * uAspect, vUv.y) * 3.0 + vec2(uTime * 0.04, uTime * 0.017);
    float e = 0.07;
    float n1 = fbm(p + vec2(0.0, e));
    float n2 = fbm(p - vec2(0.0, e));
    float n3 = fbm(p + vec2(e, 0.0));
    float n4 = fbm(p - vec2(e, 0.0));
    vec2 force = vec2(n1 - n2, -(n3 - n4)) / (2.0 * e);
    vec2 vel = texture2D(uVelocity, vUv).xy;
    vel += force * uStrength * uDt * 10.0;
    gl_FragColor = vec4(vel, 0.0, 1.0);
  }
`;

// 障碍:大标题文字。墨水撞上不穿过 —— 字内速度清零(不可穿透固体),
// 字缘把指向字内的速度分量去掉,让墨绕着字形流走而非钻进去。
// 障碍形状来自离屏渲染的文字覆盖图(uObstacle.r = 字内覆盖度)。
const obstacleVelShader = `
  precision highp float;
  varying vec2 vUv;
  uniform sampler2D uVelocity;
  uniform sampler2D uObstacle;
  void main () {
    float e = 0.0035;
    float c  = texture2D(uObstacle, vUv).r;
    vec2 vel = texture2D(uVelocity, vUv).xy;
    if (c > 0.85) { gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0); return; }
    float cL = texture2D(uObstacle, vUv - vec2(e, 0.0)).r;
    float cR = texture2D(uObstacle, vUv + vec2(e, 0.0)).r;
    float cB = texture2D(uObstacle, vUv - vec2(0.0, e)).r;
    float cT = texture2D(uObstacle, vUv + vec2(0.0, e)).r;
    vec2 grad = vec2(cR - cL, cT - cB);   // 指向字内(覆盖度升高方向)
    float gl = length(grad);
    if (gl > 1e-4) {
      vec2 ind = grad / gl;
      float vn = dot(vel, ind);
      if (vn > 0.0) vel -= ind * vn * smoothstep(0.02, 0.5, c);
    }
    gl_FragColor = vec4(vel, 0.0, 1.0);
  }
`;

// 把渗进字内的墨抹掉 —— 不膨胀,墨直接贴到字形边缘(无白边)
const obstacleDyeShader = `
  precision highp float;
  varying vec2 vUv;
  uniform sampler2D uDye;
  uniform sampler2D uObstacle;
  void main () {
    float c = texture2D(uObstacle, vUv).r;
    float m = 1.0 - smoothstep(0.45, 0.7, c);   // 仅字形内部为0
    vec3 dye = texture2D(uDye, vUv).rgb;
    gl_FragColor = vec4(dye * m, 1.0);
  }
`;

// 最终合成:纯白纸面 + 黑墨。零状态 = 干净纯白,无雾无边缘晕染。
const displayShader = `
  precision highp float;
  varying vec2 vUv;
  uniform sampler2D uDye;
  uniform sampler2D uObstacle;
  uniform vec2 uDyeTexel;
  uniform float uTime;
  uniform float uAspect;

  float hash (vec2 p) {
    p = fract(p * vec2(127.1, 311.7));
    p += dot(p, p + 34.23);
    return fract(p.x * p.y);
  }
  float vnoise (vec2 p) {
    vec2 i = floor(p); vec2 f = fract(p);
    vec2 u = f * f * (3.0 - 2.0 * f);
    float a = hash(i);
    float b = hash(i + vec2(1.0, 0.0));
    float c = hash(i + vec2(0.0, 1.0));
    float d = hash(i + vec2(1.0, 1.0));
    return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
  }
  float fbm (vec2 p) {
    float v = 0.0; float a = 0.5;
    mat2 m = mat2(1.6, 1.2, -1.2, 1.6);
    for (int i = 0; i < 4; i++) { v += a * vnoise(p); p = m * p; a *= 0.5; }
    return v;
  }

  void main () {
    vec2 uv = vUv;
    vec2 suv = vec2(uv.x * uAspect, uv.y);
    float t = uTime;

    vec4 d4 = texture2D(uDye, uv);
    float ink  = d4.r;   // 近层浓墨
    float tr   = d4.g;   // 墨痕(快逝)
    float zink = d4.b;   // 深层墨(z轴沉入)

    // 纸面 #faf9f7 (token paper-50)
    vec3 paper = vec3(0.980, 0.976, 0.969);
    vec3 col = paper;

    vec3 inkCol = vec3(0.263, 0.235, 0.204);  // 墨色 #433C34
    vec3 inkDeep = vec3(0.0);                  // 浓处压到黑(渐变下限)

    // 仅在有墨处才出现的颗粒,零状态绝不污染纸底
    float grain = fbm(suv * 22.0);

    // 第零层:深层墨 —— 退到"纸背",淡淡的墨调
    float zd = smoothstep(0.04, 0.55, zink * (0.85 + 0.30 * grain));
    col = mix(col, mix(paper, inkCol, 0.62), zd * 0.9);

    // 第一层:墨痕,细而浅
    float trace = smoothstep(0.035, 0.45, tr * (0.80 + 0.40 * grain));
    col = mix(col, inkCol, trace * 0.55);

    // 第二层:浓墨本体 —— #433C34 渐变到黑,边缘被颗粒啃出晕染感
    float dmod = ink * (0.72 + 0.55 * grain);
    float body = smoothstep(0.14, 0.62, dmod);
    float core = smoothstep(0.55, 1.35, dmod);
    col = mix(col, inkCol, body);
    // 浓墨内部:随密度起伏从 #433C34 沉到黑,避免死黑一片
    float marble = fbm(suv * 9.0 + vec2(ink * 0.7, -ink * 0.5) + vec2(t * 0.012, 0.0));
    col = mix(col, mix(inkDeep, inkCol, marble * 0.45), core);

    // 大标题文字:压在最上层,#433C34→黑 的纵向渐变(墨与字同色,自然相融)
    // 障碍纹理已按原生像素密度渲染,其自带的抗锯齿覆盖度直接作为字形 alpha
    // —— 等同浏览器原生文字的边缘质量,无需再做阈值化(那会让边缘发糙)
    float text = texture2D(uObstacle, uv).r;
    vec3 textCol = mix(inkDeep, inkCol, clamp(uv.y * 1.15 - 0.05, 0.0, 1.0));
    col = mix(col, textCol, text);

    gl_FragColor = vec4(col, 1.0);
  }
`;

/* ============================================================
 *  效果 2:粒子。粒子被流体速度场拖动(点击/拖拽即喷射),
 *  与文字障碍碰撞反弹。黑底,白色微粒。
 * ============================================================ */

// 粒子状态更新:rg = 位置(uv), ba = 速度(uv/秒)
const particleUpdateShader = `
  precision highp float;
  varying vec2 vUv;
  uniform sampler2D uParticles;
  uniform sampler2D uVelocity;
  uniform sampler2D uObstacle;
  uniform vec2 uVelTexel;
  uniform float uDt;
  uniform float uTime;
  uniform float uSpeed;
  uniform float uDrag;
  uniform float uCollision;
  float hash (vec2 p) {
    p = fract(p * vec2(127.1, 311.7));
    p += dot(p, p + 34.23);
    return fract(p.x * p.y);
  }
  void main () {
    vec4 P = texture2D(uParticles, vUv);
    vec2 pos = P.xy;
    vec2 vel = P.zw;

    // 跟随流体速度(带惯性 → 弹道散射感)
    vec2 fv = texture2D(uVelocity, pos).xy * uVelTexel * uSpeed;
    vel = mix(vel, fv, 1.0 - exp(-uDt * uDrag));
    // 极轻微布朗扰动,避免完全静止板结
    float r = hash(vUv + fract(uTime));
    vel += (vec2(hash(vUv + 0.13), hash(vUv + 0.71)) - 0.5) * 0.004 * uDt;

    vec2 npos = pos + vel * uDt;

    // 文字障碍碰撞:撞入字内则沿法线弹出
    float c = texture2D(uObstacle, npos).r;
    if (c > 0.5) {
      float e = 0.0035;
      float cL = texture2D(uObstacle, npos - vec2(e, 0.0)).r;
      float cR = texture2D(uObstacle, npos + vec2(e, 0.0)).r;
      float cB = texture2D(uObstacle, npos - vec2(0.0, e)).r;
      float cT = texture2D(uObstacle, npos + vec2(0.0, e)).r;
      vec2 n = normalize(vec2(cL - cR, cB - cT) + 1e-5);  // 指向字外
      vel = reflect(vel, n) * uCollision;
      npos = pos + n * 0.002;
    }

    // 边界:环绕
    npos = fract(npos + 1.0);

    gl_FragColor = vec4(npos, vel);
  }
`;

// 粒子渲染:逐点读取位置纹理,画成发光小点
const particleRenderVert = `
  precision highp float;
  attribute float aIndex;
  uniform sampler2D uParticles;
  uniform sampler2D uColorTex;
  uniform vec2 uTexSize;
  uniform float uPointSize;
  uniform float uVar;      // 0..1:尺寸/明暗/虚化的变化强度(3D 尘埃感)
  varying vec3 vColor;
  varying float vSoft;     // 越大越虚
  varying float vAlpha;
  float h11 (float x) { return fract(sin(x * 12.9898) * 43758.5453); }
  void main () {
    float x = mod(aIndex, uTexSize.x);
    float y = floor(aIndex / uTexSize.x);
    vec2 uv = (vec2(x, y) + 0.5) / uTexSize;
    vec4 P = texture2D(uParticles, uv);

    float s = h11(aIndex * 0.123 + 1.0);    // 尺寸/景深种子
    float b = h11(aIndex * 0.317 + 5.0);    // 明暗种子
    float big = smoothstep(0.70, 1.0, s);   // 少数大颗粒 → 散景/前景虚化
    float sizeMul = mix(1.0, mix(0.8, 3.4, big) * (0.7 + 0.6 * b), uVar);
    vSoft  = big * uVar;                     // 大颗粒更虚
    float shade = mix(1.0, mix(0.55, 1.18, b), uVar);
    vColor = texture2D(uColorTex, uv).rgb * shade;
    vAlpha = mix(1.0, mix(0.9, 0.32, big), uVar);  // 大虚颗粒更透(像失焦)

    vec2 clip = P.xy * 2.0 - 1.0;
    gl_Position = vec4(clip, 0.0, 1.0);
    gl_PointSize = uPointSize * sizeMul;
  }
`;
const particleRenderFrag = `
  precision highp float;
  varying vec3 vColor;
  varying float vSoft;
  varying float vAlpha;
  void main () {
    float r = length(gl_PointCoord - 0.5) * 2.0;   // 0 中心 .. 1 边缘
    float edge = mix(0.85, 0.12, vSoft);           // 锐:陡边缘;虚:渐隐
    float a = (1.0 - smoothstep(edge, 1.0, r)) * vAlpha;
    if (a < 0.012) discard;
    gl_FragColor = vec4(vColor, a);
  }
`;

// 文字粒子:每颗粒子有"归位"目标(取自文字覆盖),弹簧回家 + 轻微浮动,
// 悬停轻推起波动,按住拖拽强推 → 吐出粒子,随后弹回。粒子只在原位附近浮动。
const textParticleUpdateShader = `
  precision highp float;
  varying vec2 vUv;
  uniform sampler2D uParticles;
  uniform sampler2D uHome;
  uniform float uDt;
  uniform float uTime;
  uniform float uAspect;
  uniform vec2 uPointer;
  uniform float uDown;
  uniform float uSpring;
  uniform float uDamp;
  uniform float uFloat;
  uniform float uHoverForce;
  uniform float uDragForce;
  uniform float uRadius;
  uniform float uTurb;       // 湍流/活跃度
  float hash (vec2 p) {
    p = fract(p * vec2(127.1, 311.7));
    p += dot(p, p + 34.23);
    return fract(p.x * p.y);
  }
  float vnoise (vec2 p) {
    vec2 i = floor(p); vec2 f = fract(p);
    vec2 u = f * f * (3.0 - 2.0 * f);
    return mix(mix(hash(i), hash(i + vec2(1.0,0.0)), u.x),
               mix(hash(i + vec2(0.0,1.0)), hash(i + vec2(1.0,1.0)), u.x), u.y);
  }
  // 旋转的多倍频势函数:每层都旋转,使 value-noise 的"导数沿格点为零"伪影
  // 不再与屏幕轴对齐(否则会出现细直线),叠加后被打散
  float curlPot (vec2 p) {
    mat2 R = mat2(0.80, -0.60, 0.60, 0.80);   // ~37°
    p = R * p;
    float v = 0.0, a = 0.60;
    for (int i = 0; i < 3; i++) { v += a * vnoise(p); p = R * p * 1.93 + 7.3; a *= 0.55; }
    return v;
  }
  void main () {
    vec4 P = texture2D(uParticles, vUv);
    vec2 pos = P.xy;
    vec2 vel = P.zw;
    vec2 home = texture2D(uHome, vUv).xy;

    // 每颗粒子绕 home 的平滑漂浮目标(Lissajous):
    // 用持久的每粒子相位做正弦摆动,而非逐帧随机踢 —— 避免随机游走导致弥散与伪影
    float s1 = hash(vUv * 7.13);
    float s2 = hash(vUv * 7.13 + 3.70);
    vec2 drift = uFloat * 0.006 * vec2(sin(uTime * 0.90 + s1 * 6.2831),
                                       sin(uTime * 1.17 + s2 * 6.2831));

    // 弹簧回(漂浮中的)家 —— 始终把粒子拉回字形原位附近
    vel += (home + drift - pos) * uSpring * uDt;

    // 湍流:旋转 curl-noise 流场让粒子群持续涌动(活跃度),弹簧仍把它们收在字形附近
    if (uTurb > 0.0001) {
      vec2 q = vec2(pos.x * uAspect, pos.y) * 3.0 + vec2(uTime * 0.16, uTime * 0.11);
      float e = 0.06;
      float px = curlPot(q + vec2(e, 0.0)) - curlPot(q - vec2(e, 0.0));
      float py = curlPot(q + vec2(0.0, e)) - curlPot(q - vec2(0.0, e));
      vec2 curl = vec2(py, -px) / (2.0 * e);   // 标量势的旋度 → 无散度流场
      vel += curl * uTurb * 0.013 * uDt;
    }

    // 光标作用(aspect 校正的圆形影响域)
    vec2 d = vec2((pos.x - uPointer.x) * uAspect, pos.y - uPointer.y);
    float infl = exp(-dot(d, d) / (uRadius * uRadius));
    vec2 dir = normalize(d + 1e-5);
    float force = mix(uHoverForce, uDragForce, uDown);   // 悬停轻推 / 按住强推
    vel += dir * force * infl * uDt;

    vel *= exp(-uDt * uDamp);     // 阻尼 → 不乱飞,很快归于平静
    pos += vel * uDt;

    gl_FragColor = vec4(pos, vel);
  }
`;

// 粒子模式底图:黑底 + 文字(淡灰,粒子在其周围堆叠勾勒)
const particleBgShader = `
  precision highp float;
  varying vec2 vUv;
  uniform sampler2D uObstacle;
  void main () {
    float text = texture2D(uObstacle, vUv).r;
    vec3 col = mix(vec3(0.0), vec3(0.22, 0.24, 0.27), text);
    gl_FragColor = vec4(col, 1.0);
  }
`;

/* ============================================================
 *  效果 3:冰晶生成。冻结态在噪声场引导下向邻域扩散成枝晶,
 *  由光标播种。黑底,淡蓝。
 * ============================================================ */

// 冻结态 CA:r = 冻结量(0..1)。生长被约束在一张"脊线网络"上 → 枝晶/霜花
const crystalUpdateShader = `
  precision highp float;
  varying vec2 vUv;
  uniform sampler2D uState;
  uniform sampler2D uObstacle;
  uniform vec2 uTexel;
  uniform float uTime;
  uniform float uRate;
  uniform float uAspect;
  float hash (vec2 p) {
    p = fract(p * vec2(127.1, 311.7));
    p += dot(p, p + 34.23);
    return fract(p.x * p.y);
  }
  float vnoise (vec2 p) {
    vec2 i = floor(p); vec2 f = fract(p);
    vec2 u = f * f * (3.0 - 2.0 * f);
    return mix(mix(hash(i), hash(i + vec2(1.0,0.0)), u.x),
               mix(hash(i + vec2(0.0,1.0)), hash(i + vec2(1.0,1.0)), u.x), u.y);
  }
  float ridge (vec2 p) { return 1.0 - abs(2.0 * vnoise(p) - 1.0); }
  // 脊线网络:domain-warp 的 ridged noise → 细而分叉的霜花骨架
  float frost (vec2 uv) {
    vec2 p = vec2(uv.x * uAspect, uv.y) * 9.5;
    p += 0.55 * vec2(vnoise(p * 1.9), vnoise(p * 1.9 + 9.3));
    return ridge(p) * 0.55 + ridge(p * 2.6 + 3.0) * 0.30 + ridge(p * 5.6 + 7.0) * 0.15;
  }
  void main () {
    float s = texture2D(uState, vUv).r;
    if (s > 0.5) { gl_FragColor = vec4(1.0, 0.0, 0.0, 1.0); return; }

    // 统计 8 邻域冻结数(越少 = 越靠近枝晶尖端)
    float nf = 0.0;
    nf += step(0.5, texture2D(uState, vUv + vec2( uTexel.x, 0.0)).r);
    nf += step(0.5, texture2D(uState, vUv + vec2(-uTexel.x, 0.0)).r);
    nf += step(0.5, texture2D(uState, vUv + vec2(0.0,  uTexel.y)).r);
    nf += step(0.5, texture2D(uState, vUv + vec2(0.0, -uTexel.y)).r);
    nf += step(0.5, texture2D(uState, vUv + vec2( uTexel.x,  uTexel.y)).r);
    nf += step(0.5, texture2D(uState, vUv + vec2(-uTexel.x,  uTexel.y)).r);
    nf += step(0.5, texture2D(uState, vUv + vec2( uTexel.x, -uTexel.y)).r);
    nf += step(0.5, texture2D(uState, vUv + vec2(-uTexel.x, -uTexel.y)).r);

    float grown = 0.0;
    if (nf > 0.5) {
      // 仅在脊线上蔓延 → 细枝晶,而非铺满成团
      float ridgeMask = smoothstep(0.70, 0.88, frost(vUv));
      float tip = 1.0 - smoothstep(1.0, 5.0, nf);   // 尖端更易延伸
      float p = uRate * ridgeMask * (0.35 + 0.65 * tip);
      float gate = hash(floor(vUv / uTexel) + floor(uTime * 45.0));
      if (gate < p) grown = 1.0;
    }
    // 不在文字内生长
    float c = texture2D(uObstacle, vUv).r;
    grown *= step(c, 0.5);

    gl_FragColor = vec4(grown, 0.0, 0.0, 1.0);
  }
`;

// 冰晶渲染:黑底,枝晶淡蓝,生长前沿最亮
const crystalDisplayShader = `
  precision highp float;
  varying vec2 vUv;
  uniform sampler2D uState;
  uniform sampler2D uObstacle;
  uniform vec2 uTexel;
  void main () {
    float s = texture2D(uState, vUv).r;
    // 模糊一圈估计"前沿":自身已冻结但邻域稀疏处最亮
    float blur = 0.0;
    for (int x = -2; x <= 2; x++)
      for (int y = -2; y <= 2; y++)
        blur += texture2D(uState, vUv + vec2(float(x), float(y)) * uTexel * 1.5).r;
    blur /= 25.0;

    vec3 col = vec3(0.0);
    vec3 iceDeep = vec3(0.28, 0.52, 0.76);   // 晶体主体淡蓝
    vec3 iceEdge = vec3(0.82, 0.94, 1.00);   // 前沿冷白蓝

    col += iceDeep * s * 0.70;
    float front = clamp(s - blur, 0.0, 1.0);          // 生长前沿
    col += iceEdge * front * 1.8;                      // 更亮的生长锋面
    col += vec3(0.16, 0.32, 0.52) * blur * 0.55;       // 外溢冷辉光

    // 文字:淡蓝压在上层
    float text = texture2D(uObstacle, vUv).r;
    col = mix(col, vec3(0.36, 0.50, 0.66), text * 0.85);

    gl_FragColor = vec4(col, 1.0);
  }
`;

/* ---------------- framebuffers ---------------- */

let quadBuffer, quadIndexBuffer;
const blit = (() => {
  quadBuffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quadBuffer);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, -1, 1, 1, 1, 1, -1]), gl.STATIC_DRAW);
  quadIndexBuffer = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, quadIndexBuffer);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array([0, 1, 2, 0, 2, 3]), gl.STATIC_DRAW);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.enableVertexAttribArray(0);
  return (target) => {
    if (target == null) {
      gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight);
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    } else {
      gl.viewport(0, 0, target.width, target.height);
      gl.bindFramebuffer(gl.FRAMEBUFFER, target.fbo);
    }
    gl.drawElements(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0);
  };
})();

function createFBO(w, h, internalFormat, format, type, filter) {
  gl.activeTexture(gl.TEXTURE0);
  const texture = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, texture);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, internalFormat, w, h, 0, format, type, null);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
  gl.viewport(0, 0, w, h);
  gl.clear(gl.COLOR_BUFFER_BIT);
  return {
    texture, fbo, width: w, height: h,
    texelSizeX: 1 / w, texelSizeY: 1 / h,
    attach(id) {
      gl.activeTexture(gl.TEXTURE0 + id);
      gl.bindTexture(gl.TEXTURE_2D, texture);
      return id;
    }
  };
}

function createDoubleFBO(w, h, internalFormat, format, type, filter) {
  let fbo1 = createFBO(w, h, internalFormat, format, type, filter);
  let fbo2 = createFBO(w, h, internalFormat, format, type, filter);
  return {
    width: w, height: h,
    texelSizeX: fbo1.texelSizeX, texelSizeY: fbo1.texelSizeY,
    get read() { return fbo1; },
    set read(v) { fbo1 = v; },
    get write() { return fbo2; },
    set write(v) { fbo2 = v; },
    swap() { const t = fbo1; fbo1 = fbo2; fbo2 = t; }
  };
}

function getResolution(resolution) {
  let aspectRatio = gl.drawingBufferWidth / gl.drawingBufferHeight;
  if (aspectRatio < 1) aspectRatio = 1 / aspectRatio;
  const min = Math.round(resolution);
  const max = Math.round(resolution * aspectRatio);
  if (gl.drawingBufferWidth > gl.drawingBufferHeight)
    return { width: max, height: min };
  return { width: min, height: max };
}

/* ---------------- programs ---------------- */

const filterKeywords = ext.supportLinearFiltering ? null : ['MANUAL_FILTERING'];

// Core programs — shared across modes (resize/reset paths; splat seeds both ink
// blooms and crystal frost). Tiny shaders, compiled eagerly.
const copyProgram        = new Program(baseVertexShader, copyShader);
const clearProgram       = new Program(baseVertexShader, clearShader);
const splatProgram       = new Program(baseVertexShader, splatShader);

// Fluid ("ink") programs — DEFERRED. The landing boots in particle mode, so these
// 10 (the heaviest shaders, incl. the 3-layer fog display pass) aren't compiled or
// linked until the user actually switches to ink. This is the single biggest cut
// to boot-time main-thread jank on weak GPUs.
let advectionProgram, divergenceProgram, curlProgram, vorticityProgram,
    pressureProgram, gradSubtractProgram, ambientFlowProgram, obstacleVelProgram,
    obstacleDyeProgram, displayProgram;
let inkProgramsReady = false;
function ensureInkPrograms() {
  if (inkProgramsReady) return;
  advectionProgram    = new Program(baseVertexShader, advectionShader, filterKeywords);
  divergenceProgram   = new Program(baseVertexShader, divergenceShader);
  curlProgram         = new Program(baseVertexShader, curlShader);
  vorticityProgram    = new Program(baseVertexShader, vorticityShader);
  pressureProgram     = new Program(baseVertexShader, pressureShader);
  gradSubtractProgram = new Program(baseVertexShader, gradientSubtractShader);
  ambientFlowProgram  = new Program(baseVertexShader, ambientFlowShader);
  obstacleVelProgram  = new Program(baseVertexShader, obstacleVelShader);
  obstacleDyeProgram  = new Program(baseVertexShader, obstacleDyeShader);
  displayProgram      = new Program(baseVertexShader, displayShader);
  inkProgramsReady = true;
}

// 粒子初始化:随机散布
const particleInitShader = `
  precision highp float;
  varying vec2 vUv;
  float hash (vec2 p) {
    p = fract(p * vec2(127.1, 311.7));
    p += dot(p, p + 34.23);
    return fract(p.x * p.y);
  }
  void main () {
    vec2 pos = vec2(hash(vUv * 1.31 + 0.11), hash(vUv * 2.73 + 0.57));
    gl_FragColor = vec4(pos, 0.0, 0.0);
  }
`;
const particleVertexShader = compileShader(gl.VERTEX_SHADER, particleRenderVert);

const particleInitProgram   = new Program(baseVertexShader, particleInitShader);
const particleUpdateProgram = new Program(baseVertexShader, particleUpdateShader);
const textParticleProgram   = new Program(baseVertexShader, textParticleUpdateShader);
const particleRenderProgram = new Program(particleVertexShader, particleRenderFrag);
const particleBgProgram     = new Program(baseVertexShader, particleBgShader);
// Crystal (frost) programs — DEFERRED until the user switches to crystal mode.
let crystalUpdateProgram, crystalDisplayProgram;
let crystalProgramsReady = false;
function ensureCrystalPrograms() {
  if (crystalProgramsReady) return;
  crystalUpdateProgram  = new Program(baseVertexShader, crystalUpdateShader);
  crystalDisplayProgram = new Program(baseVertexShader, crystalDisplayShader);
  crystalProgramsReady = true;
}

let dye, velocity, divergence, curl, pressure;

/* ---------------- 文字障碍纹理 ---------------- */
// 把大标题渲染进离屏 2D 画布 → 上传为覆盖图,既当流体里的固体障碍,
// 也在 display 里取样描黑。两者同源,天然对齐。
const textCanvas = document.createElement('canvas');
const tctx = textCanvas.getContext('2d');
const obstacleTexture = gl.createTexture();

function buildObstacle() {
  const w = canvas.width, h = canvas.height;   // 绘制缓冲尺寸(已含 DPR)
  if (w === 0 || h === 0) return;
  textCanvas.width = w;
  textCanvas.height = h;

  tctx.clearRect(0, 0, w, h);
  tctx.fillStyle = '#000';            // 黑底 = 覆盖度 0
  tctx.fillRect(0, 0, w, h);
  tctx.fillStyle = '#fff';            // 白字 = 覆盖度 1
  tctx.textAlign = 'left';
  tctx.textBaseline = 'top';

  const family = 'Roboto, "Helvetica Neue", Arial, sans-serif';
  // 名字加粗(700,粒子下更可读),职衔粗黑(900),全大写
  const boldMaxW = w * 0.80;          // 最宽一行的目标宽度

  const layout = (boldSize) => {
    const nameSize = boldSize * 0.64;
    return [
      { t: 'YICHEN XIE',      weight: 700, size: nameSize, adv: nameSize * 1.12, gapAfter: nameSize * 0.46 },
      { t: 'AI PRODUCT',      weight: 900, size: boldSize, adv: boldSize * 0.98, gapAfter: 0 },
      { t: 'DESIGNER +',      weight: 900, size: boldSize, adv: boldSize * 0.98, gapAfter: 0 },
      { t: 'DESIGN ENGINEER', weight: 900, size: boldSize, adv: boldSize * 0.98, gapAfter: 0 },
    ];
  };

  // 以最宽的粗体行适配宽度
  tctx.font = '900 100px ' + family;
  let boldSize = 100 * boldMaxW / tctx.measureText('DESIGN ENGINEER').width;
  let lines = layout(boldSize);
  let totalH = lines.reduce((a, l) => a + l.adv + l.gapAfter, 0);
  if (totalH > h * 0.84) {            // 再受高度约束
    boldSize *= (h * 0.84) / totalH;
    lines = layout(boldSize);
    totalH = lines.reduce((a, l) => a + l.adv + l.gapAfter, 0);
  }

  // 视觉居中:按最宽行的宽度把整块水平居中
  let widest = 0;
  for (const l of lines) {
    tctx.font = l.weight + ' ' + l.size + 'px ' + family;
    widest = Math.max(widest, tctx.measureText(l.t).width);
  }
  const x0 = (w - widest) / 2;

  let y = h * 0.5 - totalH * 0.5;
  for (const l of lines) {
    tctx.font = l.weight + ' ' + l.size + 'px ' + family;
    tctx.fillText(l.t, x0, y);
    y += l.adv + l.gapAfter;
  }

  gl.bindTexture(gl.TEXTURE_2D, obstacleTexture);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);   // 对齐 WebGL 的 uv.y 向上
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, textCanvas);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

  // 几何变了 → 重建粒子归位坐标(图像源则按图重建),并顺势回位
  if (typeof buildParticleHomes === 'function') {
    if (particleSource === 'image' && lastImage) buildImageHomes(lastImage);
    else buildParticleHomes();
    if (mode === 'particle' && homesReady) resetTextParticles();
  }
}
let lastImage = null;

function bindObstacle(unit) {
  gl.activeTexture(gl.TEXTURE0 + unit);
  gl.bindTexture(gl.TEXTURE_2D, obstacleTexture);
  return unit;
}

function initFramebuffers() {
  const simRes = getResolution(config.SIM_RESOLUTION);
  const dyeRes = getResolution(config.DYE_RESOLUTION);
  const texType = ext.halfFloatTexType;
  const rgba = ext.formatRGBA, rg = ext.formatRG, r = ext.formatR;
  const filtering = ext.supportLinearFiltering ? gl.LINEAR : gl.NEAREST;
  gl.disable(gl.BLEND);

  if (dye == null)
    dye = createDoubleFBO(dyeRes.width, dyeRes.height, rgba.internalFormat, rgba.format, texType, filtering);
  else
    dye = resizeDoubleFBO(dye, dyeRes.width, dyeRes.height, rgba.internalFormat, rgba.format, texType, filtering);

  if (velocity == null)
    velocity = createDoubleFBO(simRes.width, simRes.height, rg.internalFormat, rg.format, texType, filtering);
  else
    velocity = resizeDoubleFBO(velocity, simRes.width, simRes.height, rg.internalFormat, rg.format, texType, filtering);

  divergence = createFBO(simRes.width, simRes.height, r.internalFormat, r.format, texType, gl.NEAREST);
  curl       = createFBO(simRes.width, simRes.height, r.internalFormat, r.format, texType, gl.NEAREST);
  pressure   = createDoubleFBO(simRes.width, simRes.height, r.internalFormat, r.format, texType, gl.NEAREST);
}

/* ---------------- 粒子 / 冰晶 缓冲 ---------------- */

let particles, crystal, particleIndexBuffer, homeTexture, colorTexture;
let PARTICLE_TEX = 320;                          // 实际粒子纹理边长(count² 颗);boot 时被 targetTex() 覆盖
// 文字粒子墨色 — 跟随主题:亮色用墨黑,暗色翻成暖白(粒子场即背景,必须同步反相)
const INK_LIGHT = [0.16, 0.14, 0.12];
const INK_DARK  = [0.93, 0.91, 0.87];
function themeIsDark() { return document.documentElement.getAttribute('data-theme') === 'dark'; }
const INK_RGB = (themeIsDark() ? INK_DARK : INK_LIGHT).slice();
let homesReady = false;
let particleSource = 'text';                    // 'text' | 'image'

// 响应式:窄屏文字更小,粒子数与点大小按视口宽度等比缩小,保持视觉密度一致
const REF_W = 1440;
function rScale() {
  const w = window.innerWidth || REF_W;
  return Math.min(1, Math.max(0.42, w / REF_W));
}
// 点大小比数量缩得更温和(小屏文字仍要够实) → 用 rScale 的幂次提升下限
function pointScale() { return Math.pow(rScale(), 0.7); }
// 目标粒子边长:数量 ∝ 文字面积 ∝ 宽度² → 边长 ∝ 宽度
function targetTex() {
  return Math.max(96, Math.min(640, Math.round(pconfig.count * rScale() / 32) * 32));
}

function initParticleSystem() {
  const texType = ext.halfFloatTexType;
  const rgba = ext.formatRGBA;
  // 位置/速度需要可重复采样 → NEAREST 精确
  if (particles == null)
    particles = createDoubleFBO(PARTICLE_TEX, PARTICLE_TEX, rgba.internalFormat, rgba.format, texType, gl.NEAREST);

  // 归位目标纹理(rg = home uv);webgl2 用 32F 直接上传 CPU 数据
  if (homeTexture == null && isWebGL2) {
    homeTexture = makeDataTex(gl.RGBA32F, gl.FLOAT);
    colorTexture = makeDataTex(gl.RGBA, gl.UNSIGNED_BYTE);    // 逐点颜色
  }

  // 粒子索引缓冲(一次性)
  if (particleIndexBuffer == null) {
    const n = PARTICLE_TEX * PARTICLE_TEX;
    const idx = new Float32Array(n);
    for (let i = 0; i < n; i++) idx[i] = i;
    particleIndexBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, particleIndexBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, idx, gl.STATIC_DRAW);
  }
  resetParticles();
}

function makeDataTex(internalFormat, type) {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, internalFormat, PARTICLE_TEX, PARTICLE_TEX, 0,
    internalFormat === gl.RGBA32F ? gl.RGBA : internalFormat, type, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
}

function resetParticles() {
  gl.disable(gl.BLEND);
  particleInitProgram.bind();
  blit(particles.read);
  blit(particles.write);
}

// 在指定边长重建所有粒子相关纹理/缓冲,再按当前源重建归位
function rebuildParticlesAt(tex) {
  tex = Math.max(96, Math.min(640, Math.round(tex / 32) * 32));
  if (tex === PARTICLE_TEX && particles) return;
  PARTICLE_TEX = tex;
  // 释放旧资源
  if (particles) { gl.deleteTexture(particles.read.texture); gl.deleteTexture(particles.write.texture);
                   gl.deleteFramebuffer(particles.read.fbo); gl.deleteFramebuffer(particles.write.fbo); }
  if (homeTexture) gl.deleteTexture(homeTexture);
  if (colorTexture) gl.deleteTexture(colorTexture);
  if (particleIndexBuffer) gl.deleteBuffer(particleIndexBuffer);
  particles = null; homeTexture = null; colorTexture = null; particleIndexBuffer = null;
  homesReady = false;
  initParticleSystem();
  if (particleSource === 'image' && lastImage) buildImageHomes(lastImage);
  else buildParticleHomes();
  if (homesReady) resetTextParticles();
}

// 按当前视口的响应式目标边长重建(断点未变则空转)
function rebuildParticles() { rebuildParticlesAt(targetTex()); }

// 把每颗粒子的 home(uv)与颜色上传
function uploadHomes(homeData, colorData) {
  gl.bindTexture(gl.TEXTURE_2D, homeTexture);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, PARTICLE_TEX, PARTICLE_TEX, 0, gl.RGBA, gl.FLOAT, homeData);
  gl.bindTexture(gl.TEXTURE_2D, colorTexture);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, PARTICLE_TEX, PARTICLE_TEX, 0, gl.RGBA, gl.UNSIGNED_BYTE, colorData);
}

// 从文字覆盖图采样出每颗粒子的归位坐标(单色墨点)
function buildParticleHomes() {
  if (!isWebGL2 || homeTexture == null) return;
  const w = textCanvas.width, h = textCanvas.height;
  if (w === 0 || h === 0) return;
  const img = tctx.getImageData(0, 0, w, h).data;
  const stepPx = Math.max(1, Math.round(Math.sqrt((w * h) / 240000)));
  const pts = [];
  for (let y = 0; y < h; y += stepPx)
    for (let x = 0; x < w; x += stepPx)
      if (img[(y * w + x) * 4] > 128) pts.push(x, y);

  const N = PARTICLE_TEX * PARTICLE_TEX;
  const home = new Float32Array(N * 4);
  const col = new Uint8Array(N * 4);
  const m = pts.length / 2;
  const cr = INK_RGB[0] * 255, cg = INK_RGB[1] * 255, cb = INK_RGB[2] * 255;
  for (let i = 0; i < N; i++) {
    let ux, uy;
    if (m > 0) {
      const j = (Math.random() * m) | 0;
      ux = (pts[j * 2] + (Math.random() - 0.5) * stepPx) / w;
      uy = 1.0 - (pts[j * 2 + 1] + (Math.random() - 0.5) * stepPx) / h;
    } else { ux = Math.random(); uy = Math.random(); }
    home[i * 4] = ux; home[i * 4 + 1] = uy;
    col[i * 4] = cr; col[i * 4 + 1] = cg; col[i * 4 + 2] = cb; col[i * 4 + 3] = 255;
  }
  uploadHomes(home, col);
  homesReady = m > 0;
  particleSource = 'text';
}

// 把一张图转成粒子:按暗度加权采样落点,逐点取图像颜色
function buildImageHomes(image) {
  if (!isWebGL2 || homeTexture == null) return;
  const aspect = canvas.width / canvas.height || 1;
  // 图像等比缩放到画面 ~78%,居中 → 求其在 uv 空间的矩形
  const margin = 0.84;
  let rw, rh;                        // uv 空间的宽高
  const imgA = image.width / image.height;
  if (imgA > aspect) { rw = margin; rh = margin * (aspect / imgA); }
  else               { rh = margin; rw = margin * (imgA / aspect); }
  const rx = 0.5 - rw / 2, ry = 0.5 - rh / 2;

  // 采样用的小画布
  const SW = 360, SH = Math.max(1, Math.round(SW / imgA));
  const c = document.createElement('canvas');
  c.width = SW; c.height = SH;
  const cx = c.getContext('2d');
  cx.drawImage(image, 0, 0, SW, SH);
  const px = cx.getImageData(0, 0, SW, SH).data;

  const N = PARTICLE_TEX * PARTICLE_TEX;
  const home = new Float32Array(N * 4);
  const col = new Uint8Array(N * 4);
  for (let i = 0; i < N; i++) {
    // 拒绝采样:暗(有内容)处概率更高
    let sx = 0, sy = 0, idx = 0, ok = false;
    for (let tries = 0; tries < 28; tries++) {
      sx = (Math.random() * SW) | 0;
      sy = (Math.random() * SH) | 0;
      idx = (sy * SW + sx) * 4;
      const lum = (px[idx] * 0.299 + px[idx + 1] * 0.587 + px[idx + 2] * 0.114) / 255;
      if (Math.random() < (1.0 - lum) * 0.97 + 0.02) { ok = true; break; }
    }
    // home uv:矩形内,y 向上
    const u = rx + (sx + Math.random()) / SW * rw;
    const v = ry + (1.0 - (sy + Math.random()) / SH) * rh;
    home[i * 4] = u; home[i * 4 + 1] = v;
    col[i * 4] = px[idx]; col[i * 4 + 1] = px[idx + 1]; col[i * 4 + 2] = px[idx + 2]; col[i * 4 + 3] = 255;
  }
  uploadHomes(home, col);
  homesReady = true;
  particleSource = 'image';
}

// 把粒子瞬间放回原位(copy home → particles)
function resetTextParticles() {
  if (homeTexture == null) return;
  gl.disable(gl.BLEND);
  copyProgram.bind();
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, homeTexture);
  gl.uniform1i(copyProgram.uniforms.uTexture, 0);
  blit(particles.read);
  blit(particles.write);
}

function initCrystalSystem() {
  const dyeRes = getResolution(config.DYE_RESOLUTION);
  const texType = ext.halfFloatTexType;
  const r = ext.formatR;
  const filtering = ext.supportLinearFiltering ? gl.LINEAR : gl.NEAREST;
  crystal = createDoubleFBO(dyeRes.width, dyeRes.height, r.internalFormat, r.format, texType, filtering);
}

function resetCrystal() {
  // 清空 + 中心播一粒种子,便于一上来就能生长
  gl.disable(gl.BLEND);
  clearProgram.bind();
  gl.uniform1i(clearProgram.uniforms.uTexture, crystal.read.attach(0));
  gl.uniform1f(clearProgram.uniforms.value, 0.0);
  blit(crystal.write);
  crystal.swap();
  clearProgram.bind();
  gl.uniform1i(clearProgram.uniforms.uTexture, crystal.read.attach(0));
  gl.uniform1f(clearProgram.uniforms.value, 0.0);
  blit(crystal.write);
  crystal.swap();
}

function resizeDoubleFBO(target, w, h, internalFormat, format, type, filter) {
  if (target.width === w && target.height === h) return target;
  const newFBO = createDoubleFBO(w, h, internalFormat, format, type, filter);
  copyProgram.bind();
  gl.uniform1i(copyProgram.uniforms.uTexture, target.read.attach(0));
  blit(newFBO.read);
  return newFBO;
}

/* ---------------- interaction ---------------- */

const splatQueue = [];
let interacted = false;

function scaleByPixelRatio(input) {
  const pixelRatio = Math.min(window.devicePixelRatio || 1, config.DPR_CAP);
  return Math.floor(input * pixelRatio);
}

function correctRadius(radius) {
  const aspectRatio = canvas.width / canvas.height;
  if (aspectRatio > 1) radius *= aspectRatio;
  return radius;
}

function splat(x, y, dx, dy, inkAmt, traceAmt, deepAmt, radius) {
  splatProgram.bind();
  gl.uniform1i(splatProgram.uniforms.uTarget, velocity.read.attach(0));
  gl.uniform1f(splatProgram.uniforms.aspectRatio, canvas.width / canvas.height);
  gl.uniform2f(splatProgram.uniforms.point, x, y);
  gl.uniform3f(splatProgram.uniforms.color, dx, dy, 0.0);
  gl.uniform1f(splatProgram.uniforms.radius, correctRadius(radius));
  blit(velocity.write);
  velocity.swap();

  gl.uniform1i(splatProgram.uniforms.uTarget, dye.read.attach(0));
  gl.uniform3f(splatProgram.uniforms.color, inkAmt, traceAmt, deepAmt);
  blit(dye.write);
  dye.swap();
}

function burst(x, y) {
  // 泼墨:中心一团 + z轴深层一团 + 放射状碎墨
  splatQueue.push({ x, y, dx: 0, dy: 0, ink: 0.68, trace: 0, deep: 0.15, radius: 0.0032 * (0.7 + Math.random() * 0.6) });
  // z轴向里:更大更淡的一团直接沉在雾后,近层墨随后也会持续下沉
  splatQueue.push({ x, y, dx: 0, dy: 0, ink: 0, trace: 0, deep: 0.30, radius: 0.011 });
  const n = 7 + Math.floor(Math.random() * 4);
  for (let i = 0; i < n; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 70 + Math.random() * 200;
    const off = Math.random() * 0.02;
    splatQueue.push({
      x: x + Math.cos(angle) * off,
      y: y + Math.sin(angle) * off,
      dx: Math.cos(angle) * speed,
      dy: Math.sin(angle) * speed,
      ink: 0.18 + Math.random() * 0.4,
      trace: 0,
      deep: Math.random() * 0.12,
      radius: 0.0005 + Math.random() * 0.0026
    });
  }
}

const pointer = { x: 0, y: 0, px: 0, py: 0, down: false, inited: false };

function pointerUV(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) / rect.width,
    y: 1.0 - (e.clientY - rect.top) / rect.height
  };
}

window.addEventListener('pointerdown', e => {
  if (e.target.closest && e.target.closest('.nav, .switch, .debug, .work, .work-dots')) return;  // UI/作品区 不触发效果
  const p = pointerUV(e);
  pointer.x = pointer.px = p.x;
  pointer.y = pointer.py = p.y;
  pointer.down = true;
  pointer.inited = true;
  if (mode === 'crystal') seedQueue.push({ x: p.x, y: p.y, amount: 1.0, radius: 0.00012 });
  else if (mode === 'particle' && pconfig.sub === 'text') { /* 文字粒子:由 shader 读光标处理 */ }
  else burst(p.x, p.y);
  if (!interacted) {
    interacted = true;
    document.getElementById('hint').classList.add('faded');
  }
});

window.addEventListener('pointermove', e => {
  const p = pointerUV(e);
  if (!pointer.inited) {
    pointer.px = p.x; pointer.py = p.y;
    pointer.inited = true;
  } else {
    pointer.px = pointer.x; pointer.py = pointer.y;
  }
  pointer.x = p.x; pointer.y = p.y;
  if (!pointer.down) return;   // 悬停墨痕由主循环里的平滑光标生成
  let dx = pointer.x - pointer.px;
  let dy = pointer.y - pointer.py;
  let speed = Math.hypot(dx, dy);
  if (speed <= 0.0) return;
  if (mode === 'crystal') {     // 拖拽沿途播撒晶种
    if (seedQueue.length < 64) seedQueue.push({ x: p.x, y: p.y, amount: 1.0, radius: 0.00010 });
    return;
  }
  if (mode === 'particle' && pconfig.sub === 'text') return;  // 由 shader 读光标
  if (splatQueue.length > 64) return;
  // 限幅:光标跳变/狂甩时不让墨量失控
  if (speed > 0.05) {
    const k = 0.05 / speed;
    dx *= k; dy *= k; speed = 0.05;
  }
  // 拖拽:沿轨迹缓缓注墨,速度越快略散,但收着
  splatQueue.push({
    x: p.x, y: p.y,
    dx: dx * 2200, dy: dy * 2200,
    ink: 0.28 + Math.min(speed * 4.5, 0.22),
    trace: 0,
    deep: 0.05,
    radius: 0.0011 + Math.min(speed * 0.030, 0.0016)
  });
});

// 平滑光标:墨痕不直接跟手,而是像被水拖着追随
const smooth = { x: 0, y: 0, inited: false };

function emitTrace(dt) {
  if (!pointer.inited) return;
  if (pointer.down || !smooth.inited) {
    smooth.x = pointer.x; smooth.y = pointer.y;
    smooth.inited = true;
    return;
  }
  const k = 1.0 - Math.exp(-dt * 5.0);   // 追随的松紧
  const nx = smooth.x + (pointer.x - smooth.x) * k;
  const ny = smooth.y + (pointer.y - smooth.y) * k;
  const dx = nx - smooth.x, dy = ny - smooth.y;
  smooth.x = nx; smooth.y = ny;
  const sp = Math.hypot(dx, dy);
  if (sp < 0.0003 || splatQueue.length > 64) return;
  splatQueue.push({
    x: nx, y: ny,
    dx: dx * 220, dy: dy * 220,        // 轻微扰动,不搅动存量墨
    ink: 0,
    trace: Math.min(sp * 26.0, 0.45),  // 随手速:慢移几乎不留痕
    deep: 0,
    radius: 0.00042
  });
}

let mode = 'particle';
const seedQueue = [];

// 粒子可调参数(debug 面板实时改写)
const pconfig = {
  sub: 'text',          // 目前仅 'text'(字/图由粒子组成)
  count: 320,           // 粒子纹理边长(count² 颗 ≈ 102k;448≈201k 太重,更新/顶点开销减半)
  pointSize: 0.95,      // 随 count 减半按 √2 补大,墨量覆盖不变(coverage ∝ count·size²)
  spring: 14.0,         // 回家弹簧强度
  damp: 2.6,            // 阻尼(越大越快静止 ≈ 扰动寿命)
  float: 0.6,           // 漂浮幅度
  liveliness: 1.95,     // 湍流活跃度
  variation: 0.7,       // 尺寸/明暗/虚化变化(3D 尘埃感)
  hoverForce: 0.5,      // 悬停轻推(波动)
  dragForce: 1.5,       // 按住强推(吐出)
  radius: 0.19,         // 光标影响半径
};
const FLOAT_INTRO = 3.0;   // 入场漂浮幅度
let introT = -1;           // 入场动画起点(performance.now)

function applyTheme() {
  document.body.classList.toggle('mode-dark', mode === 'crystal');
}

// Lazily stand up a mode's GPU resources the first time it's entered. ink/crystal
// are deferred off the landing path (particle is the default), so the fluid/frost
// shaders + framebuffers only get built when the user actually switches into them.
function ensureInk() {
  if (inkReady) return;
  ensureInkPrograms();
  initFramebuffers();
  inkReady = true;
}
function ensureCrystal() {
  if (crystalReady) return;
  ensureCrystalPrograms();
  initCrystalSystem();
  crystalReady = true;
}

function setMode(m) {
  if (m === 'ink') ensureInk();
  else if (m === 'crystal') ensureCrystal();
  const same = m === mode;
  mode = m;
  applyTheme();
  document.querySelectorAll('.switch:not(.hero-switch) button').forEach(b =>
    b.classList.toggle('active', b.dataset.mode === m));
  const hint = document.getElementById('hint');
  hint.innerHTML = m === 'ink'
    ? 'Move &middot; ink trails<span class="sep">—</span>Click / Drag &middot; ink blooms'
    : m === 'particle'
      ? 'Move &middot; ripple<span class="sep">—</span>Click / Drag &middot; spit particles'
      : 'Click / Drag<span class="sep">—</span>seed the frost';
  document.getElementById('debugToggle').style.display = 'none';   // Tune button hidden (dev-only affordance)
  if (m !== 'particle') document.getElementById('debug').classList.remove('open');
  if (m === 'crystal') resetCrystal();
  if (m === 'particle' && homesReady) resetTextParticles();   // 不再做入场漂浮动画
}

/* ---------------- dedicated liquid landing ----------------
   The project index still shares this document with the archived fluid engine below.
   While the purpose-built liquid landing is active, that legacy loop idles and its
   canvas stays hidden; landing-liquid.js owns the visible SDF circles instead. */
let landingActive = false, landingReady = false;

// Keep the browser toolbar tint matched to the active theme. The liquid renderer now
// follows that same theme directly, so the landing no longer borrows dark-mode tokens
// while a visitor has light mode selected.
function syncThemeColor() {
  const root = document.documentElement;
  const dark = root.getAttribute('data-theme') === 'dark';
  const c = dark ? '#181818' : '#faf9f7';      // match --page-bg (dark/light)
  const m = document.querySelector('meta[name="theme-color"]');
  if (m && m.content !== c) m.content = c;
}
function updateHeroChrome() {
  const root = document.documentElement;
  root.removeAttribute('data-hero-veil');
  syncThemeColor();
}
window.addEventListener('scroll', updateHeroChrome, { passive: true });
window.addEventListener('themechange', updateHeroChrome);   // re-evaluate when the user toggles

function setHero(h) {
  const toLiquid = h === 'liquid';
  const landingCanvas = document.getElementById('landingLiquid');
  const landingBio = document.getElementById('landingBio');
  const hint = document.getElementById('hint');
  if (toLiquid) {
    document.body.classList.add('hero-liquid');
    landingCanvas.setAttribute('aria-hidden', 'false');
    landingBio.setAttribute('aria-hidden', 'false');
    landingActive = true;
    updateHeroChrome();
    if (hint) hint.innerHTML = 'Click &middot; bounce<span class="sep">—</span>Drag &middot; draw<span class="sep">—</span>Double click &middot; pop';
  } else {
    landingActive = false;
    document.body.classList.remove('hero-liquid');
    document.documentElement.removeAttribute('data-hero-veil');
    landingCanvas.setAttribute('aria-hidden', 'true');
    landingBio.setAttribute('aria-hidden', 'true');
    if (hint) hint.innerHTML = (mode === 'particle')
      ? 'Move &middot; ripple<span class="sep">—</span>Click / Drag &middot; spit particles'
      : 'Move &middot; ink trails<span class="sep">—</span>Click / Drag &middot; ink blooms';
  }
}

/* ---------------- 粒子步进 / 渲染 ---------------- */

function particleStep(dt) {
  if (!(isWebGL2 && homesReady)) return;
  gl.disable(gl.BLEND);
  textParticleProgram.bind();
  gl.uniform1i(textParticleProgram.uniforms.uParticles, particles.read.attach(0));
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, homeTexture);
  gl.uniform1i(textParticleProgram.uniforms.uHome, 1);
  gl.uniform1f(textParticleProgram.uniforms.uDt, Math.min(dt, 1 / 60));
  gl.uniform1f(textParticleProgram.uniforms.uTime, simTime);
  gl.uniform1f(textParticleProgram.uniforms.uAspect, canvas.width / canvas.height);
  gl.uniform2f(textParticleProgram.uniforms.uPointer, pointer.inited ? pointer.x : -1, pointer.inited ? pointer.y : -1);
  gl.uniform1f(textParticleProgram.uniforms.uDown, pointer.down ? 1.0 : 0.0);
  gl.uniform1f(textParticleProgram.uniforms.uSpring, pconfig.spring);
  gl.uniform1f(textParticleProgram.uniforms.uDamp, pconfig.damp);
  gl.uniform1f(textParticleProgram.uniforms.uFloat, currentFloat());
  gl.uniform1f(textParticleProgram.uniforms.uTurb, pconfig.liveliness);
  gl.uniform1f(textParticleProgram.uniforms.uHoverForce, pconfig.hoverForce);
  gl.uniform1f(textParticleProgram.uniforms.uDragForce, pconfig.dragForce);
  gl.uniform1f(textParticleProgram.uniforms.uRadius, pconfig.radius);
  blit(particles.write);
  particles.swap();
}

// 入场:float 从 3 缓出到默认值,历时 1s
function currentFloat() {
  if (introT < 0) return pconfig.float;
  const p = Math.min((performance.now() - introT) / 1000, 1);
  const ease = 1 - Math.pow(1 - p, 3);   // easeOutCubic
  if (p >= 1) introT = -1;
  return FLOAT_INTRO + (pconfig.float - FLOAT_INTRO) * ease;
}

function renderParticles() {
  // 纸面底图(粒子即文字/图)— 亮色 #faf9f7,暗色 #181818
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight);
  gl.disable(gl.BLEND);
  if (themeIsDark()) gl.clearColor(0.094, 0.094, 0.094, 1.0);   // #181818 (dark page-bg)
  else gl.clearColor(0.980, 0.976, 0.969, 1.0);                 // #faf9f7 (token paper-50)
  gl.clear(gl.COLOR_BUFFER_BIT);
  if (!(isWebGL2 && homesReady)) return;

  // 逐点上色(text=墨色;image=取自图像)
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  particleRenderProgram.bind();
  gl.uniform1i(particleRenderProgram.uniforms.uParticles, particles.read.attach(0));
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, colorTexture);
  gl.uniform1i(particleRenderProgram.uniforms.uColorTex, 2);
  gl.uniform2f(particleRenderProgram.uniforms.uTexSize, PARTICLE_TEX, PARTICLE_TEX);
  const dpr = Math.min(window.devicePixelRatio || 1, config.DPR_CAP);
  gl.uniform1f(particleRenderProgram.uniforms.uPointSize, pconfig.pointSize * dpr * pointScale());
  gl.uniform1f(particleRenderProgram.uniforms.uVar, pconfig.variation);
  gl.bindBuffer(gl.ARRAY_BUFFER, particleIndexBuffer);
  const loc = gl.getAttribLocation(particleRenderProgram.program, 'aIndex');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 1, gl.FLOAT, false, 0, 0);
  gl.drawArrays(gl.POINTS, 0, PARTICLE_TEX * PARTICLE_TEX);
  gl.disableVertexAttribArray(loc);
  gl.disable(gl.BLEND);
  // 恢复全屏四边形顶点绑定供后续 blit 使用
  gl.bindBuffer(gl.ARRAY_BUFFER, quadBuffer);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.enableVertexAttribArray(0);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, quadIndexBuffer);
}

/* ---------------- 冰晶步进 / 渲染 ---------------- */

function applySeeds() {
  if (seedQueue.length === 0) return;
  gl.disable(gl.BLEND);
  splatProgram.bind();
  gl.uniform1f(splatProgram.uniforms.aspectRatio, canvas.width / canvas.height);
  while (seedQueue.length > 0) {
    const s = seedQueue.shift();
    gl.uniform1i(splatProgram.uniforms.uTarget, crystal.read.attach(0));
    gl.uniform2f(splatProgram.uniforms.point, s.x, s.y);
    gl.uniform3f(splatProgram.uniforms.color, s.amount, 0.0, 0.0);
    gl.uniform1f(splatProgram.uniforms.radius, correctRadius(s.radius));
    blit(crystal.write);
    crystal.swap();
  }
}

function crystalStep() {
  gl.disable(gl.BLEND);
  // 每帧多迭代几次,让生长更快更密
  for (let i = 0; i < 3; i++) {
    crystalUpdateProgram.bind();
    gl.uniform1i(crystalUpdateProgram.uniforms.uState, crystal.read.attach(0));
    gl.uniform1i(crystalUpdateProgram.uniforms.uObstacle, bindObstacle(1));
    gl.uniform2f(crystalUpdateProgram.uniforms.uTexel, crystal.texelSizeX, crystal.texelSizeY);
    gl.uniform1f(crystalUpdateProgram.uniforms.uTime, simTime + i * 0.137);
    gl.uniform1f(crystalUpdateProgram.uniforms.uRate, 0.9);
    gl.uniform1f(crystalUpdateProgram.uniforms.uAspect, canvas.width / canvas.height);
    blit(crystal.write);
    crystal.swap();
  }
}

function renderCrystal() {
  gl.disable(gl.BLEND);
  crystalDisplayProgram.bind();
  gl.uniform1i(crystalDisplayProgram.uniforms.uState, crystal.read.attach(0));
  gl.uniform1i(crystalDisplayProgram.uniforms.uObstacle, bindObstacle(1));
  gl.uniform2f(crystalDisplayProgram.uniforms.uTexel, crystal.texelSizeX, crystal.texelSizeY);
  blit(null);
}

window.addEventListener('pointercancel', () => { pointer.down = false; });

/* ---------------- simulation step ---------------- */

let simTime = 0;

function step(dt) {
  gl.disable(gl.BLEND);

  // 环境流场:水下漂移
  ambientFlowProgram.bind();
  gl.uniform1i(ambientFlowProgram.uniforms.uVelocity, velocity.read.attach(0));
  gl.uniform1f(ambientFlowProgram.uniforms.uTime, simTime);
  gl.uniform1f(ambientFlowProgram.uniforms.uDt, dt);
  gl.uniform1f(ambientFlowProgram.uniforms.uStrength, config.AMBIENT_FLOW);
  gl.uniform1f(ambientFlowProgram.uniforms.uAspect, canvas.width / canvas.height);
  blit(velocity.write);
  velocity.swap();

  // 涡度
  curlProgram.bind();
  gl.uniform2f(curlProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
  gl.uniform1i(curlProgram.uniforms.uVelocity, velocity.read.attach(0));
  blit(curl);

  vorticityProgram.bind();
  gl.uniform2f(vorticityProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
  gl.uniform1i(vorticityProgram.uniforms.uVelocity, velocity.read.attach(0));
  gl.uniform1i(vorticityProgram.uniforms.uCurl, curl.attach(1));
  gl.uniform1f(vorticityProgram.uniforms.curl, config.CURL);
  gl.uniform1f(vorticityProgram.uniforms.dt, dt);
  blit(velocity.write);
  velocity.swap();

  // 压力投影
  divergenceProgram.bind();
  gl.uniform2f(divergenceProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
  gl.uniform1i(divergenceProgram.uniforms.uVelocity, velocity.read.attach(0));
  blit(divergence);

  clearProgram.bind();
  gl.uniform1i(clearProgram.uniforms.uTexture, pressure.read.attach(0));
  gl.uniform1f(clearProgram.uniforms.value, 0.8);
  blit(pressure.write);
  pressure.swap();

  pressureProgram.bind();
  gl.uniform2f(pressureProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
  gl.uniform1i(pressureProgram.uniforms.uDivergence, divergence.attach(0));
  for (let i = 0; i < config.PRESSURE_ITERATIONS; i++) {
    gl.uniform1i(pressureProgram.uniforms.uPressure, pressure.read.attach(1));
    blit(pressure.write);
    pressure.swap();
  }

  gradSubtractProgram.bind();
  gl.uniform2f(gradSubtractProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
  gl.uniform1i(gradSubtractProgram.uniforms.uPressure, pressure.read.attach(0));
  gl.uniform1i(gradSubtractProgram.uniforms.uVelocity, velocity.read.attach(1));
  blit(velocity.write);
  velocity.swap();

  // 平流
  advectionProgram.bind();
  gl.uniform2f(advectionProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
  if (!ext.supportLinearFiltering)
    gl.uniform2f(advectionProgram.uniforms.dyeTexelSize, velocity.texelSizeX, velocity.texelSizeY);
  const velocityId = velocity.read.attach(0);
  gl.uniform1i(advectionProgram.uniforms.uVelocity, velocityId);
  gl.uniform1i(advectionProgram.uniforms.uSource, velocityId);
  gl.uniform1f(advectionProgram.uniforms.dt, dt);
  gl.uniform1f(advectionProgram.uniforms.uSink, 0.0);
  gl.uniform3f(advectionProgram.uniforms.dissipation,
    config.VELOCITY_DISSIPATION, config.VELOCITY_DISSIPATION, config.VELOCITY_DISSIPATION);
  blit(velocity.write);
  velocity.swap();

  if (!ext.supportLinearFiltering)
    gl.uniform2f(advectionProgram.uniforms.dyeTexelSize, dye.texelSizeX, dye.texelSizeY);
  gl.uniform1i(advectionProgram.uniforms.uVelocity, velocity.read.attach(0));
  gl.uniform1i(advectionProgram.uniforms.uSource, dye.read.attach(1));
  gl.uniform1f(advectionProgram.uniforms.uSink, config.INK_SINK);
  gl.uniform3f(advectionProgram.uniforms.dissipation,
    config.INK_DISSIPATION, config.TRACE_DISSIPATION, config.DEEP_DISSIPATION);
  blit(dye.write);
  dye.swap();

  // 障碍:字内速度清零 + 字缘切向偏转,然后抹掉渗入字内的墨
  obstacleVelProgram.bind();
  gl.uniform1i(obstacleVelProgram.uniforms.uVelocity, velocity.read.attach(0));
  gl.uniform1i(obstacleVelProgram.uniforms.uObstacle, bindObstacle(1));
  blit(velocity.write);
  velocity.swap();

  obstacleDyeProgram.bind();
  gl.uniform1i(obstacleDyeProgram.uniforms.uDye, dye.read.attach(0));
  gl.uniform1i(obstacleDyeProgram.uniforms.uObstacle, bindObstacle(1));
  blit(dye.write);
  dye.swap();
}

function render() {
  displayProgram.bind();
  gl.uniform1i(displayProgram.uniforms.uDye, dye.read.attach(0));
  gl.uniform1i(displayProgram.uniforms.uObstacle, bindObstacle(1));
  gl.uniform2f(displayProgram.uniforms.uDyeTexel, dye.texelSizeX, dye.texelSizeY);
  gl.uniform1f(displayProgram.uniforms.uTime, simTime);
  gl.uniform1f(displayProgram.uniforms.uAspect, canvas.width / canvas.height);
  blit(null);
}

function applyInputs() {
  while (splatQueue.length > 0) {
    const s = splatQueue.shift();
    splat(s.x, s.y, s.dx, s.dy, s.ink, s.trace, s.deep || 0, s.radius);
  }
}

function resizeCanvas() {
  const width = scaleByPixelRatio(canvas.clientWidth);
  const height = scaleByPixelRatio(canvas.clientHeight);
  if (canvas.width !== width || canvas.height !== height) {
    canvas.width = width;
    canvas.height = height;
    return true;
  }
  return false;
}

function projectMediaNode(card) {
  return card ? card.querySelector('video, phone-mockup') : null;
}

function projectMediaVideo(media) {
  if (!media) return null;
  return media.tagName === 'PHONE-MOCKUP' ? (media.video || media.querySelector('video')) : media;
}

function setProjectMediaPreload(card, preloadMode) {
  const media = projectMediaNode(card);
  if (!media) return;
  if (media.tagName === 'PHONE-MOCKUP' && media.getAttribute('preload') !== preloadMode) {
    media.setAttribute('preload', preloadMode);
  }
  const video = projectMediaVideo(media);
  if (!video || video.preload === preloadMode) return;
  video.preload = preloadMode;
  if (preloadMode === 'auto' && video.readyState < 2) video.load();
}

function playProjectMedia(card) {
  const media = projectMediaNode(card);
  if (!media) return;
  const controller = typeof media.play === 'function' ? media : projectMediaVideo(media);
  const result = controller && typeof controller.play === 'function' ? controller.play() : null;
  if (result && typeof result.catch === 'function') result.catch(() => {});
}

function pauseProjectMedia(card) {
  const media = projectMediaNode(card);
  const controller = media && typeof media.pause === 'function' ? media : projectMediaVideo(media);
  if (controller && typeof controller.pause === 'function') controller.pause();
}

      + '<a class="mobile-project-card is-' + escAttr(p.layout) + '" data-project="' + escAttr(p.id) + '" data-case="' + escAttr(p.id) + '" href="' + escAttr(href) + '" aria-label="Open ' + escAttr(p.title) + ' case study">'
      + desktopMediaMarkup(p, mobile && i === 0 ? 'auto' : mobile && i === 1 ? 'metadata' : 'none')
      + '<div class="mobile-project-copy">'
      + '<div class="mobile-project-heading">' + desktopIconMarkup(p) + '<h2 class="mobile-project-title">' + escHtml(p.title) + '</h2></div>'
      + '<p class="desktop-card-description">' + escHtml(p.desc) + '</p>'
      + '<div class="desktop-card-tags">' + p.tags.map(tag => '<span class="desktop-card-tag">' + escHtml(tag) + '</span>').join('') + '</div>'
      + '</div></a></div></article>';
  }).join('') + '</div>';
}

function initDesktopWork() {
  if (desktopWorkCleanup) desktopWorkCleanup();
  const panel = workEl.querySelector('.desktop-work-panel');
  const shell = panel && panel.querySelector('.desktop-work-shell');
  const rope = shell && shell.querySelector('.desktop-rope');
  if (!panel || !shell || !rope) return;

  // Warm both real Noto Sans faces before the first hover. This avoids a
  // fallback-to-italic swap while the title is already changing weight.
  if (document.fonts) {
    document.fonts.load('300 58px "Noto Sans"').catch(() => {});
    document.fonts.load('italic 500 58px "Noto Sans"').catch(() => {});
  }

  const ropePath = rope.querySelector('path');
  const ropeStart = rope.querySelector('.rope-start');
  const ropeEnd = rope.querySelector('.rope-end');
  const titles = [...shell.querySelectorAll('.desktop-project-title')];
  const cards = [...shell.querySelectorAll('.desktop-project-card')];
  const filters = [...shell.querySelectorAll('.desktop-work-tag')];
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let activeId = '';
  let activeTitle = null;
  let activeCard = null;
  let sag = 0;
  let sagVelocity = 0;
  let sagTarget = 44;
  let closing = false;
  let raf = 0;
  let last = performance.now();
  let hideTimer = 0;
  let showTimer = 0;
  let selectedFilter = '';

  function cancelHide() {
    if (hideTimer) clearTimeout(hideTimer);
    hideTimer = 0;
  }

  function cancelShow() {
    if (showTimer) clearTimeout(showTimer);
    showTimer = 0;
  }

  function ropePoints() {
    if (!activeTitle || !activeCard) return null;
    const sr = shell.getBoundingClientRect();
    const tr = activeTitle.getBoundingClientRect();
    const cr = activeCard.getBoundingClientRect();
    let sx = tr.right - sr.left + 24;
    let ex = cr.left - sr.left - 24;
    if (ex < sx + 30) {
      sx = tr.right - sr.left + 8;
      ex = cr.left - sr.left - 8;
    }
    return {
      sx, sy: tr.top - sr.top + tr.height * .52,
      ex, ey: cr.top - sr.top + cr.height * .5
    };
  }

  function drawRope() {
    const p = ropePoints();
    if (!p) return;
    const dx = p.ex - p.sx;
    const c1x = p.sx + dx * .34;
    const c2x = p.sx + dx * .69;
    ropePath.setAttribute('d', 'M ' + p.sx.toFixed(2) + ' ' + p.sy.toFixed(2) +
      ' C ' + c1x.toFixed(2) + ' ' + (p.sy + sag).toFixed(2) + ', ' +
      c2x.toFixed(2) + ' ' + (p.ey + sag).toFixed(2) + ', ' +
      p.ex.toFixed(2) + ' ' + p.ey.toFixed(2));
    ropeStart.setAttribute('cx', p.sx.toFixed(2));
    ropeStart.setAttribute('cy', p.sy.toFixed(2));
    ropeEnd.setAttribute('cx', p.ex.toFixed(2));
    ropeEnd.setAttribute('cy', p.ey.toFixed(2));
  }

  function animateRope(now) {
    raf = 0;
    const dt = Math.min(.032, Math.max(.001, (now - last) / 1000));
    last = now;
    if (reduceMotion) {
      sag = closing ? 0 : sagTarget;
      sagVelocity = 0;
    } else {
      const acceleration = (sagTarget - sag) * 118 - sagVelocity * 15.5;
      sagVelocity += acceleration * dt;
      sag += sagVelocity * dt;
    }
    drawRope();
    const settled = Math.abs(sagTarget - sag) < .08 && Math.abs(sagVelocity) < .08;
    if (!settled) {
      raf = requestAnimationFrame(animateRope);
    } else if (closing) {
      rope.classList.remove('is-visible');
      activeId = '';
      activeTitle = activeCard = null;
      closing = false;
    }
  }

  function ensureAnimation() {
    if (!raf) {
      last = performance.now();
      raf = requestAnimationFrame(animateRope);
    }
  }

  function showProject(id) {
    cancelHide();
    const nextTitle = shell.querySelector('.desktop-project-title[data-project="' + id + '"]');
    const nextCard = shell.querySelector('.desktop-project-card[data-project="' + id + '"]');
    if (!nextTitle || !nextCard) return;
    const firstReveal = !activeId || closing;
    if (activeTitle && activeTitle !== nextTitle) activeTitle.classList.remove('is-active');
    if (activeCard && activeCard !== nextCard) {
      activeCard.classList.remove('is-active');
      activeCard.setAttribute('aria-hidden', 'true');
      activeCard.tabIndex = -1;
      pauseProjectMedia(activeCard);
    }
    const changed = activeId !== id;
    activeId = id;
    activeTitle = nextTitle;
    activeCard = nextCard;
    activeTitle.classList.add('is-active');
    activeCard.classList.add('is-active');
    activeCard.setAttribute('aria-hidden', 'false');
    activeCard.tabIndex = 0;
    playProjectMedia(activeCard);
    closing = false;
    sagTarget = 44;
    if (changed && firstReveal) {
      sag = 0;
      sagVelocity = 0;
    }
    rope.classList.add('is-visible');
    drawRope();
    ensureAnimation();
  }

  function hideProject() {
    cancelHide();
    if (!activeId || !activeTitle || !activeCard) return;
    activeTitle.classList.remove('is-active');
    activeCard.classList.remove('is-active');
    activeCard.setAttribute('aria-hidden', 'true');
    activeCard.tabIndex = -1;
    pauseProjectMedia(activeCard);
    rope.classList.remove('is-visible');
    sagTarget = 0;
    closing = true;
    ensureAnimation();
  }

  function scheduleHide(delay) {
    cancelHide();
    hideTimer = setTimeout(hideProject, delay);
  }

  function scheduleShow(id, title, delay) {
    cancelShow();
    cancelHide();
    showTimer = setTimeout(() => {
      showTimer = 0;
      if (title.matches(':hover')) showProject(id);
    }, delay);
  }

  titles.forEach(title => {
    const id = title.dataset.project;
    title.addEventListener('pointerenter', () => {
      if (activeTitle && activeTitle !== title) activeTitle.classList.remove('is-active');
      if (activeId === id && !closing) {
        cancelHide();
        return;
      }
      scheduleShow(id, title, 50);
    });
    title.addEventListener('pointerleave', e => {
      cancelShow();
      const r = title.getBoundingClientRect();
      const towardCard = e.clientX >= r.right - 2 && e.clientY >= r.top && e.clientY <= r.bottom;
      if (!towardCard && activeTitle === title) title.classList.remove('is-active');
      scheduleHide(towardCard ? 240 : 70);
    });
    title.addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') scheduleHide(0); });
    title.addEventListener('pointercancel', () => scheduleHide(0));
    title.addEventListener('focus', () => showProject(id));
    title.addEventListener('blur', () => scheduleHide(120));
    if (window.CURSOR_LABELS[id]) title.dataset.cursorKey = id;
  });

  cards.forEach(card => {
    card.addEventListener('pointerenter', cancelHide);
    card.addEventListener('pointerleave', () => scheduleHide(140));
    card.addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') scheduleHide(0); });
    card.addEventListener('pointercancel', () => scheduleHide(0));
    card.addEventListener('pointermove', e => {
      const r = card.getBoundingClientRect();
      sagTarget = 44 + Math.max(-8, Math.min(8, (e.clientY - (r.top + r.height / 2)) * .06));
      ensureAnimation();
    });
    if (window.CURSOR_LABELS[card.dataset.project]) card.dataset.cursorKey = card.dataset.project;
  });

  filters.forEach(button => {
    button.addEventListener('click', () => {
      const tag = button.dataset.filter;
      selectedFilter = selectedFilter === tag ? '' : tag;
      filters.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.filter === selectedFilter)));
      shell.querySelectorAll('.desktop-project-row').forEach(row => {
        const matches = !selectedFilter || (row.dataset.tags || '').split('|').includes(selectedFilter);
        row.hidden = !matches;
      });
      if (activeTitle && activeTitle.closest('.desktop-project-row').hidden) hideProject();
    });
  });

  const onResize = () => { if (activeId) drawRope(); };
  window.addEventListener('resize', onResize);
  panel.addEventListener('pointerleave', () => scheduleHide(100));

  desktopWorkCleanup = () => {
    cancelHide();
    cancelShow();
    if (raf) cancelAnimationFrame(raf);
    window.removeEventListener('resize', onResize);
    desktopWorkCleanup = null;
  };
}

// 仅更新某一屏的文本/图片(编辑时用,避免整段重建丢失翻卡状态)

function buildDots() {
  workDotsNav.innerHTML = '';
  workDots = workPanels.map((panel, i) => {
    const b = document.createElement('button');
    b.className = 'work-dot';
    const project = DESKTOP_PROJECTS[i];
    b.setAttribute('aria-label', (project ? project.title : 'Project ' + (i + 1)) + ', project ' + (i + 1) + ' of ' + workPanels.length);
    b.addEventListener('click', () => panel.scrollIntoView({
      behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'
    }));
    workDotsNav.appendChild(b);
    return b;
  });
