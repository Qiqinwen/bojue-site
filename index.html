function updateWorkNav() {
  const desktop = window.matchMedia('(min-width: 641px)').matches;
  if (desktop) {
    workDotsNav.classList.remove('show');
    document.body.classList.toggle('scrolled', window.scrollY > window.innerHeight * 0.4);
    return;
  }
  const midV = window.innerHeight * 0.5;
  let active = -1, best = Infinity;
  workPanels.forEach((p, i) => {
    const r = p.getBoundingClientRect();
    const d = Math.abs((r.top + r.height * 0.5) - midV);
    if (d < best) { best = d; active = i; }
  });
  const past = window.scrollY > window.innerHeight * 0.5;
  workDots.forEach((d, i) => d.classList.toggle('active', past && i === active));
  workDotsNav.classList.toggle('show', past);
  document.body.classList.toggle('scrolled', window.scrollY > window.innerHeight * 0.4);
}

// 单张卡:跟随光标 3D 倾斜 + 拖拽弹簧翻面 + 柔光
// Cursor tilt-follow + sheen lighting (NO drag-to-flip). Only binds to cards
// that still have a .work-card-inner (currently just Invoko's video card).
function bindCard(panel) {
  const wrap = panel.querySelector('.work-card');
  const inner = panel.querySelector('.work-card-inner');
  const front = panel.querySelector('.work-card-front');
  if (!wrap || !inner) return;
  let tiltX = 0, tiltY = 0;
  const setT = () => { inner.style.transform = 'rotateX(' + tiltX.toFixed(2) + 'deg) rotateY(' + tiltY.toFixed(2) + 'deg)'; };
  panel.addEventListener('pointermove', e => {
    const r = wrap.getBoundingClientRect();
    if (front && e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom) {
      front.style.setProperty('--mx', (((e.clientX - r.left) / r.width) * 100).toFixed(1) + '%');
      front.style.setProperty('--my', (((e.clientY - r.top) / r.height) * 100).toFixed(1) + '%');
    }
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const dx = Math.max(-1, Math.min(1, (e.clientX - cx) / (r.width * 0.9)));
    const dy = Math.max(-1, Math.min(1, (e.clientY - cy) / (r.height * 0.9)));
    tiltY = dx * 14; tiltX = -dy * 10; setT();
  });
  panel.addEventListener('pointerleave', () => { tiltX = 0; tiltY = 0; setT(); });
}

// Microsoft stage: drive the parallax (--mx/--my, -1..1) and the glass
// reflection (--gx/--gy, % within the stage) from the cursor over the panel.
// Microsoft card: WebGL liquid-glass composition — 3 image layers (parallax) +
// the 1980 logo as a real refracting lens (chromatic dispersion + cursor specular).
// Renders only while on screen (IntersectionObserver).
const MS_VERT = 'attribute vec2 p; void main(){ gl_Position = vec4(p,0.,1.); }';
const MS_FRAG = `
precision highp float;
uniform vec2 uRes; uniform sampler2D uL0,uL1,uL2,uLogo,uLogoH;
uniform vec3 uC[3]; uniform vec2 uHS[3]; uniform float uRad[3],uDepth[3];
uniform vec2 uLogoC,uLogoHS,uMouse; uniform vec3 uLight;
uniform float uRefract,uBevel,uChroma,uFrost,uSpec,uShine,uTint;
vec2 rot2(vec2 v,float a){ float c=cos(a),s=sin(a); return mat2(c,-s,s,c)*v; }
vec4 sampleLayer(sampler2D tex,vec3 C,vec2 HS,float rad,float depth,vec2 p){
  vec2 d=p-C.xy-uMouse*depth; vec2 lp=rot2(d,-C.z);
  vec2 q=abs(lp)-(HS-rad); float sd=length(max(q,0.0))+min(max(q.x,q.y),0.0)-rad;
  float cov=smoothstep(1.2,-1.2,sd); vec2 uv=lp/HS*0.5+0.5;
  return vec4(texture2D(tex,clamp(uv,0.001,0.999)).rgb, cov);
}
vec4 over(vec4 d, vec4 s){ float a=s.a+d.a*(1.0-s.a); vec3 c=(s.rgb*s.a+d.rgb*d.a*(1.0-s.a))/max(a,1e-4); return vec4(c,a); }
// composite the layers; alpha = coverage so empty areas stay transparent (no plate)
vec4 bg(vec2 p){ vec4 col=vec4(0.0);
  col=over(col, sampleLayer(uL0,uC[0],uHS[0],uRad[0],uDepth[0],p));
  col=over(col, sampleLayer(uL1,uC[1],uHS[1],uRad[1],uDepth[1],p));
  col=over(col, sampleLayer(uL2,uC[2],uHS[2],uRad[2],uDepth[2],p));
  return col; }
float hAt(vec2 luv){ return texture2D(uLogoH,luv).a; }
void main(){
  vec2 p=gl_FragCoord.xy; vec4 base=bg(p);
  vec2 luv=(p-uLogoC)/uLogoHS*0.5+0.5;   // no y-flip (logo was upside down)
  float inBox=step(0.0,luv.x)*step(luv.x,1.0)*step(0.0,luv.y)*step(luv.y,1.0);
  float mask=texture2D(uLogo,clamp(luv,0.0,1.0)).a*inBox;
  if(mask<0.003){ gl_FragColor=base; return; }
  vec2 o=1.6/uLogoHS;
  float hL=hAt(luv-vec2(o.x,0.)),hR=hAt(luv+vec2(o.x,0.)),hD=hAt(luv+vec2(0.,o.y)),hU=hAt(luv-vec2(0.,o.y));
  vec3 n=normalize(vec3((hL-hR),(hU-hD),uBevel/40.0));
  vec2 off=n.xy*uRefract, chro=n.xy*uChroma;
  vec4 gr=bg(p+off+chro), gg=bg(p+off), gb=bg(p+off-chro);
  vec3 refr=vec3(gr.r,gg.g,gb.b); float refrA=max(max(gr.a,gg.a),gb.a);
  if(uFrost>0.5){ vec3 acc=refr; float k=uFrost*0.12;
    acc+=bg(p+off+vec2(k,k)).rgb; acc+=bg(p+off+vec2(-k,k)).rgb; acc+=bg(p+off+vec2(k,-k)).rgb; acc+=bg(p+off+vec2(-k,-k)).rgb;
    refr=mix(refr,acc/5.0,clamp(uFrost/100.0,0.0,1.0)); }
  vec3 glass=mix(refr,vec3(0.93,0.96,1.0),uTint/100.0*(0.5+0.5*n.z));
  vec3 L=normalize(uLight),V=vec3(0.,0.,1.),Hh=normalize(L+V);
  float spec=pow(max(dot(n,Hh),0.0),uShine)*(uSpec/100.0)*2.2;
  float edge=pow(1.0-n.z,2.0);
  glass+=spec+edge*0.10*vec3(0.8,0.9,1.0);
  float ga=mask*refrA;                              // glass only over the layers
  gl_FragColor=vec4(mix(base.rgb,glass,ga), max(base.a, ga));
}`;
function initMsGlass(panel, canvas) {
  const gl = canvas.getContext('webgl', { premultipliedAlpha: false, antialias: true });
  if (!gl) return;
  const W = canvas.width, H = canvas.height;
  const LAYERS = [
    { src: 'images/ms-back.jpeg',  cx: 635, cy: 516, hw: 350, hh: 197, rot: -0.035, depth: 10, rad: 22 },
    { src: 'images/ms-mid.jpeg',   cx: 390, cy: 346, hw: 315, hh: 177, rot:  0.030, depth: 18, rad: 22 },
    { src: 'images/ms-front.jpeg', cx: 580, cy: 221, hw: 285, hh: 163, rot: -0.018, depth: 28, rad: 18 },
  ];
  const LOGO = { cx: 560, cy: 406, hw: 372, hh: 78 };
  const PR = { refract: 38, bevel: 18, chroma: 6, frost: 48, spec: 62, shine: 36, light: -50, tint: 20 };
  const loadImg = src => new Promise((res, rej) => { const i = new Image(); i.crossOrigin = 'anonymous'; i.onload = () => res(i); i.onerror = rej; i.src = src; });
  function tex(srcEl) {
    const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, srcEl);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    return t;
  }
  async function logoTex() {
    const img = await loadImg('images/microsoft-logo-1980.svg');
    const tw = 1024, th = Math.round(tw * LOGO.hh / LOGO.hw);
    const draw = blur => {
      const c = document.createElement('canvas'); c.width = tw; c.height = th;
      const x = c.getContext('2d'); if (blur) x.filter = 'blur(' + blur + 'px)';
      const iw = img.width || 1000, ih = img.height || 200, s = Math.min(tw * 0.92 / iw, th * 0.92 / ih);
      x.drawImage(img, (tw - iw * s) / 2, (th - ih * s) / 2, iw * s, ih * s); return c;
    };
    return { sharp: tex(draw(0)), height: tex(draw(18)) };
  }
  function compile(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; }
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, MS_VERT));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, MS_FRAG));
  gl.linkProgram(prog); gl.useProgram(prog);
  const qb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, qb);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const pl = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(pl); gl.vertexAttribPointer(pl, 2, gl.FLOAT, false, 0, 0);
  const U = n => gl.getUniformLocation(prog, n);

  let mouse = [0, 0];
  const tgt = panel || canvas;
  tgt.addEventListener('pointermove', e => {
    const r = canvas.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    mouse = [Math.max(-1.4, Math.min(1.4, x * 2 - 1)), Math.max(-1.4, Math.min(1.4, -(y * 2 - 1)))];
  });
  tgt.addEventListener('pointerleave', () => { mouse = [0, 0]; });

  let layerTex = [], logo = null, raf = 0, visible = false, ready = false;
  function draw() {
    raf = 0;
    if (!ready) return;
    gl.viewport(0, 0, W, H);
    gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);   // transparent → page shows through
    gl.useProgram(prog);
    gl.uniform2f(U('uRes'), W, H);
    const C = [], HS = [], RAD = [], DEP = [];
    LAYERS.forEach(l => { C.push(l.cx, l.cy, l.rot); HS.push(l.hw, l.hh); RAD.push(l.rad); DEP.push(l.depth); });
    gl.uniform3fv(U('uC[0]'), C); gl.uniform2fv(U('uHS[0]'), HS); gl.uniform1fv(U('uRad[0]'), RAD); gl.uniform1fv(U('uDepth[0]'), DEP);
    gl.uniform2f(U('uLogoC'), LOGO.cx, LOGO.cy); gl.uniform2f(U('uLogoHS'), LOGO.hw, LOGO.hh);
    gl.uniform2f(U('uMouse'), mouse[0], mouse[1]);
    const la = PR.light * Math.PI / 180;
    gl.uniform3f(U('uLight'), Math.cos(la) + mouse[0] * 0.7, Math.sin(la) + mouse[1] * 0.7, 0.7);
    gl.uniform1f(U('uRefract'), PR.refract); gl.uniform1f(U('uBevel'), PR.bevel);
    gl.uniform1f(U('uChroma'), PR.chroma); gl.uniform1f(U('uFrost'), PR.frost);
    gl.uniform1f(U('uSpec'), PR.spec); gl.uniform1f(U('uShine'), PR.shine); gl.uniform1f(U('uTint'), PR.tint);
    [layerTex[0], layerTex[1], layerTex[2], logo.sharp, logo.height].forEach((t, i) => { gl.activeTexture(gl.TEXTURE0 + i); gl.bindTexture(gl.TEXTURE_2D, t); });
    gl.uniform1i(U('uL0'), 0); gl.uniform1i(U('uL1'), 1); gl.uniform1i(U('uL2'), 2); gl.uniform1i(U('uLogo'), 3); gl.uniform1i(U('uLogoH'), 4);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    if (visible) raf = requestAnimationFrame(draw);
  }
  Promise.all(LAYERS.map(l => loadImg(l.src))).then(imgs => {
    layerTex = imgs.map(tex); return logoTex();
  }).then(l => {
    logo = l; ready = true;
    const io = new IntersectionObserver(es => {
      visible = es[0].isIntersecting;
      if (visible && !raf) raf = requestAnimationFrame(draw);
    }, { threshold: 0.01 });
    io.observe(canvas);
  }).catch(() => {});
}

/* Mobile project orbit -----------------------------------------------------
   The landing is virtual wheel position -1 and the seven native 100svh project
   panels are positions 0...6. StayPass is therefore mounted from first paint,
   one orbit step below the viewport, and the landing-to-project scroll carries
   it up the same wheel used between projects. The work gradient and card remain
   locked because both derive from native scroll; a spring adds only slight lag. */
function initMobileOrbit() {
  if (mobileOrbitCleanup) mobileOrbitCleanup();

  const mobileWork = workEl.querySelector('.mobile-work');
  const cards = mobileWork ? [...mobileWork.querySelectorAll('.mobile-project-card')] : [];
  const status = mobileWork && mobileWork.querySelector('.mobile-project-status');
  if (!mobileWork || !cards.length) return;

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  const count = cards.length;
  const step = Math.PI * 2 / count;
  let target = 0;
  let visual = 0;
  let velocity = 0;
  let raf = 0;
  let last = performance.now();
  let announced = -1;
  let settleTimer = 0;
  const dimensions = cards.map(() => ({ width: 0, height: 0 }));

  const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
  const smoothstep = (edge0, edge1, value) => {
    const t = clamp((value - edge0) / Math.max(.0001, edge1 - edge0), 0, 1);
    return t * t * (3 - 2 * t);
  };
  const signedAngle = value => {
    const turn = Math.PI * 2;
    return ((value + Math.PI) % turn + turn) % turn - Math.PI;
  };
  const heroSpace = document.querySelector('.hero-space');
  const mobileMode = () => window.matchMedia('(max-width: 640px)').matches;
  const sectionTop = () => mobileWork.getBoundingClientRect().top + window.scrollY;
  const heroTop = () => heroSpace ? heroSpace.getBoundingClientRect().top + window.scrollY : sectionTop() - window.innerHeight;
  const panelStep = () => {
    const panel = workPanels[0];
    return panel ? panel.getBoundingClientRect().height : window.innerHeight;
  };
  const orbitProgress = () => {
    const y = window.scrollY;
    const workTop = sectionTop();
    if (y < workTop) {
      const entry = clamp((y - heroTop()) / Math.max(1, workTop - heroTop()), 0, 1);
      return entry - 1;
    }
    return clamp((y - workTop) / Math.max(1, panelStep()), 0, count - 1);
  };

  function stageIsActive() {
    if (!mobileMode()) return false;
    const r = mobileWork.getBoundingClientRect();
    return r.top < window.innerHeight * .55 && r.bottom > window.innerHeight * .45;
  }

  function orbitIsVisible() {
    if (!mobileMode()) return false;
    const r = mobileWork.getBoundingClientRect();
    return window.scrollY >= heroTop() - 1 && r.bottom > 0;
  }

  function measureCard(card, i) {
    dimensions[i].width = card.offsetWidth;
    dimensions[i].height = card.offsetHeight;
  }

  cards.forEach(measureCard);
  const cardResizeObserver = typeof ResizeObserver === 'function' ? new ResizeObserver(entries => {
    entries.forEach(entry => {
      const i = cards.indexOf(entry.target);
      if (i >= 0) measureCard(entry.target, i);
    });
    renderOrbit();
  }) : null;
  if (cardResizeObserver) cards.forEach(card => cardResizeObserver.observe(card));

  if (mobileMode()) setProjectMediaPreload(cards[0], 'auto');

  function geometry() {
    const nav = document.querySelector('.nav');
    const footer = document.querySelector('.site-footer');
    const navBottom = nav ? nav.getBoundingClientRect().bottom : 68;
    const footerTop = footer ? footer.getBoundingClientRect().top : window.innerHeight - 40;
    const safeTop = Math.max(86, navBottom + 18);
    const safeBottom = Math.max(44, window.innerHeight - footerTop + 14);
    const activeX = window.innerWidth * .5 - 11;
    const activeY = safeTop + Math.max(0, window.innerHeight - safeTop - safeBottom) * .5;
    const radius = Math.max(window.innerWidth * 2.7, window.innerHeight * 1.24);
    return { activeX, activeY, radius, centerX: activeX - radius };
  }

  function renderOrbit() {
    const onMobile = mobileMode();
    const activeStage = stageIsActive();
    const visibleOrbit = orbitIsVisible();
    const scrollPhase = orbitProgress();
    const entering = scrollPhase < 0 || visual < -.001;
    const interactiveStage = activeStage && window.scrollY >= sectionTop() - 1 && visual >= -.02;
    const selected = clamp(Math.round(visual), 0, count - 1);
    const g = geometry();
    const entryOpacity = smoothstep(.12, .48, scrollPhase + 1);
    mobileWork.classList.toggle('is-orbit-active', visibleOrbit);

    cards.forEach((card, i) => {
      const current = i === selected;
      let opacity = 0;
      let x = g.activeX;
      let y = g.activeY;
      let angleDeg = 0;

      if (reduceMotion.matches) {
        opacity = interactiveStage && current ? 1 : 0;
      } else {
        const angle = signedAngle((i - visual) * step);
        const distance = Math.abs(angle);
        x = g.centerX + g.radius * Math.cos(angle);
        y = g.activeY + g.radius * Math.sin(angle);
        angleDeg = angle * 180 / Math.PI;
        opacity = entering
          ? (visibleOrbit && i === 0 ? entryOpacity : 0)
          : (visibleOrbit ? clamp(1 - Math.max(0, distance - 1.18) / .32, 0, 1) : 0);
      }

      const width = dimensions[i].width || card.offsetWidth;
      const height = dimensions[i].height || card.offsetHeight;
      card.style.transform = 'translate3d(' + (x - width * .5).toFixed(2) + 'px,' +
        (y - height * .5).toFixed(2) + 'px,0) rotate(' + angleDeg.toFixed(2) + 'deg)';
      card.style.opacity = opacity.toFixed(3);
      card.style.zIndex = String(20 - Math.round(Math.abs(i - visual) * 2));
      card.style.willChange = entering ? (i === 0 ? 'transform, opacity' : 'auto')
        : (Math.abs(i - selected) <= 1 ? 'transform, opacity' : 'auto');
      card.classList.toggle('is-orbit-current', interactiveStage && current);
      card.setAttribute('aria-hidden', interactiveStage && current ? 'false' : 'true');
      card.tabIndex = interactiveStage && current ? 0 : -1;

      const media = projectMediaNode(card);
      if (media) {
        const neighbourDistance = Math.abs(i - selected);
        const preloadMode = !onMobile ? 'none'
          : i === 0 && scrollPhase < .5 ? 'auto'
          : neighbourDistance <= 1 ? 'metadata' : 'none';
        setProjectMediaPreload(card, preloadMode);
        if (interactiveStage && current) playProjectMedia(card);
        else pauseProjectMedia(card);
      }
    });

    const focusedCard = document.activeElement && document.activeElement.closest
      ? document.activeElement.closest('.mobile-project-card') : null;
    if (!interactiveStage && focusedCard) {
      focusedCard.blur();
    } else if (interactiveStage && focusedCard && focusedCard !== cards[selected]) {
      cards[selected].focus({ preventScroll: true });
    }

    if (interactiveStage && selected !== announced) {
      announced = selected;
      if (status) status.textContent = DESKTOP_PROJECTS[selected].title + ', project ' + (selected + 1) + ' of ' + count;
    } else if (!interactiveStage) {
      announced = -1;
    }
  }

  function animate(now) {
    raf = 0;
    const dt = Math.min(.032, Math.max(.001, (now - last) / 1000));
    last = now;
    const entering = target < 0 || visual < 0;
    const stiffness = entering ? 220 : 150;
    const damping = entering ? 28 : 18;
    const before = target - visual;
    const acceleration = before * stiffness - velocity * damping;
    velocity += acceleration * dt;
    visual += velocity * dt;
    const after = target - visual;
    if (before * after < 0 && Math.abs(after) > .08) {
      visual = target - Math.sign(after) * .08;
      velocity *= .45;
    }
    renderOrbit();
    if (Math.abs(target - visual) > .0005 || Math.abs(velocity) > .0005) {
      raf = requestAnimationFrame(animate);
    } else {
      visual = target;
      velocity = 0;
      renderOrbit();
    }
  }

  function ensureAnimation() {
    if (!raf) {
      last = performance.now();
      raf = requestAnimationFrame(animate);
    }
  }

  function syncFromScroll() {
    target = orbitProgress();
    if (!('onscrollend' in window)) {
      window.clearTimeout(settleTimer);
      settleTimer = window.setTimeout(settleOrbit, 80);
    }
    if (reduceMotion.matches) {
      visual = Math.round(target);
      velocity = 0;
      renderOrbit();
    } else {
      ensureAnimation();
    }
  }

  function settleOrbit() {
    const progress = orbitProgress();
    target = progress < 0 ? progress : clamp(Math.round(progress), 0, count - 1);
    if (reduceMotion.matches) {
      visual = target;
      renderOrbit();
    } else {
      ensureAnimation();
    }
  }

  target = orbitProgress();
  visual = target;
  renderOrbit();
  const handleResize = () => {
    if (!cardResizeObserver) cards.forEach(measureCard);
    syncFromScroll();
  };
  window.addEventListener('scroll', syncFromScroll, { passive: true });
  window.addEventListener('resize', handleResize);
  window.addEventListener('scrollend', settleOrbit);
  reduceMotion.addEventListener('change', syncFromScroll);

  mobileOrbitCleanup = () => {
    if (raf) cancelAnimationFrame(raf);
    window.clearTimeout(settleTimer);
    if (cardResizeObserver) cardResizeObserver.disconnect();
    window.removeEventListener('scroll', syncFromScroll);
    window.removeEventListener('resize', handleResize);
    window.removeEventListener('scrollend', settleOrbit);
    reduceMotion.removeEventListener('change', syncFromScroll);
    cards.forEach(card => {
      pauseProjectMedia(card);
    });
    mobileOrbitCleanup = null;
  };
}

function initWorkInteractions() {
  workPanels = [...workEl.querySelectorAll('.mobile-work .work-panel')];
  buildDots();
  initDesktopWork();
  initMobileOrbit();
  // Mobile reuses the desktop project content and media; only the responsive
  // composition changes from side-by-side/hovered to media-above-copy.
  updateWorkNav();
}

window.addEventListener('scroll', updateWorkNav, { passive: true });
window.addEventListener('resize', updateWorkNav);
window.addEventListener('pointerup', () => { if (activeEnd) activeEnd(); });
window.addEventListener('pointercancel', () => { if (activeEnd) activeEnd(); });

/* ============================================================
 *  CASE-STUDY WINDOW
 *  Maps a project to the page the modal loads.
 *  Only the `original` rendering is shown for now — the tokenized
 *  rewrites have been retired and will be revisited with a different
 *  approach in a later phase.
 * ============================================================ */
const CASE_MAP = {
  'microsoft':    { title: 'Microsoft',         route: '/microsoft',    original: 'case/microsoft.original.html' },
  'dim':          { title: 'Dim App',           route: '/dim',          original: 'case/dim.original.html' },
  'arcade-brick': { title: 'Arcade Brick',      route: '/arcade-brick', original: 'case/arcade-brick.original.html' },
  'uw-design':    { title: 'UW Design 2022',    route: '/uwdesign',     original: 'case/uw-design.original.html' },
  'staypass':     { title: 'StayPass',          route: '/staypass',     original: 'case/staypass.experiment.html' },
  'invoko':       { title: 'Invoko',            route: '/invoko_ai',    original: 'case/invoko.original.html' },
  'mockordings':  { title: 'Mockordings',       route: '/mockordings',  original: 'case/mockordings.original.html' },
};
// Fall back to a title match when a project record carries no explicit caseId.
const TITLE_TO_CASE = {
  'microsoft': 'microsoft', 'dim': 'dim', 'arcade brick': 'arcade-brick',
  'uw design': 'uw-design', 'uw design 2022': 'uw-design', 'uw design class of 2022': 'uw-design',
  'staypass': 'staypass', 'invoko': 'invoko', 'mockordings': 'mockordings',
};
// Resilient prefix fallback so renaming a project in Studio (e.g. "Invoko" →
// "Invoko.ai", "Dim" → "dim — an AI…") still maps to the right case/model.
// Order matters: more specific prefixes first.
const CASE_TITLE_PREFIX = [
  ['staypass', 'staypass'], ['microsoft', 'microsoft'], ['mockordings', 'mockordings'], ['invoko', 'invoko'],
  ['arcade', 'arcade-brick'], ['uw design', 'uw-design'], ['uw', 'uw-design'], ['dim', 'dim'],
];
function caseIdFor(p) {
  if (p && p.caseId && CASE_MAP[p.caseId]) return p.caseId;
  const t = String(p && p.title || '').trim().toLowerCase();
  if (TITLE_TO_CASE[t]) return TITLE_TO_CASE[t];
  for (const [pre, id] of CASE_TITLE_PREFIX) if (t.startsWith(pre)) return id;
  return null;
}

const caseModal  = document.getElementById('caseModal');
const caseTabs   = document.getElementById('caseTabs');
const caseTrack  = document.getElementById('caseTrack');
const caseDeck   = document.getElementById('caseDeck');
const isMobileCase = () => window.matchMedia('(max-width: 700px)').matches;
let caseCard = null;                                  // one reusable active-project window
let caseSwitchTimer = 0;
let caseState = { idx: 0, animating: false };

// Tab order follows the homepage project order, so the tabs match the scroll
// order. Recomputed on open in case projects.json reorders the homepage.
let CASE_ORDER = [];
function computeCaseOrder() {
  CASE_ORDER = [];
  for (const p of projects) {
    const id = caseIdFor(p);
    if (id && CASE_MAP[id] && !CASE_ORDER.includes(id)) CASE_ORDER.push(id);
  }
  for (const id of Object.keys(CASE_MAP)) if (!CASE_ORDER.includes(id)) CASE_ORDER.push(id);
}
const CASE_TAB_LABEL = { 'microsoft': 'Microsoft Past Work' };
// Inner markup for the one active window.
const CARD_INNER =
  '<div class="card-grad"></div>' +
  '<iframe title="Case study" loading="lazy"></iframe>' +
  '<div class="case-controls">' +
    '<button class="case-expand" aria-label="Expand to full screen" aria-pressed="false">' +
      '<svg class="ico-expand" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2H2v4M10 2h4v4M6 14H2v-4M10 14h4v-4"/></svg>' +
      '<svg class="ico-compress" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 6h4V2M14 6h-4V2M2 10h4v4M14 10h-4v4"/></svg>' +
    '</button>' +
    '<button class="case-close" aria-label="Close case study">' +
      '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13"/></svg>' +
    '</button>' +
  '</div>';

function renderTabs() {
  caseTabs.innerHTML = CASE_ORDER.map(id =>
    '<button class="case-tab" role="tab" data-case="' + id + '" aria-selected="false" tabindex="-1">' +
    escHtml(CASE_TAB_LABEL[id] || CASE_MAP[id].title) + '</button>'
  ).join('');
}

// Build one reusable window and wire its iframe load state.
function buildCard() {
  caseTrack.innerHTML = '<div class="case-card">' + CARD_INNER + '</div>';
  caseCard = caseTrack.firstElementChild;
  const f = caseCard.querySelector('iframe');
  f.addEventListener('load', () => {
    if (!f.getAttribute('src')) return;
    if (caseCard.dataset.proj === 'dim' && window.DimMedia) {
      try { window.DimMedia.install(f.contentDocument); } catch (_) {}
    }
    f.classList.add('ready');
    applyCardTheme(caseCard);
    caseModal.dataset.loading = '0';
  });
}

// Bump CASE_BUILD whenever a case page or its shared assets change so browsers
// fetch the current iframe document instead of a stale cached copy.
const CASE_BUILD = '20260814v';

// Point the reusable window at the selected project. There is never more than
// one case iframe in the overlay.
function setCardProject(card, id) {
  card.dataset.proj = id;
  const f = card.querySelector('iframe');
  f.classList.remove('ready');
  card.classList.remove('dark-content');
  caseModal.dataset.loading = '1';
  const loader = caseModal.querySelector('liquid-loader');
  if (loader && typeof loader.restart === 'function') loader.restart();
  const src = CASE_MAP[id].original + '?v=' + CASE_BUILD;
  if (f.getAttribute('src') !== src) f.src = src;
}

// Sample a card's content luminance → flip its header veil colour.
function applyCardTheme(card) {
  let dark = false;
  try {
    const doc = card.querySelector('iframe').contentDocument;
    if (doc && doc.body) {
      let bg = getComputedStyle(doc.body).backgroundColor;
      if (!bg || bg === 'rgba(0, 0, 0, 0)' || bg === 'transparent')
        bg = getComputedStyle(doc.documentElement).backgroundColor;
      const m = bg && bg.match(/[\d.]+/g);
      if (m && !(m[3] !== undefined && Number(m[3]) === 0)) {
        const lum = 0.2126 * +m[0] + 0.7152 * +m[1] + 0.0722 * +m[2];
        dark = lum < 128;
      }
    }
  } catch (_) { /* cross-origin: keep light default */ }
  card.classList.toggle('dark-content', dark);
}

// Case documents mirror the site theme inside their same-origin iframe.
// Re-sample the active document after that update so modal controls keep the
// right contrast without forcing an iframe reload.
window.addEventListener('themechange', () => {
  if (!caseCard) return;
  requestAnimationFrame(() => applyCardTheme(caseCard));
});

// Reflect the current project in the tabs.
function updateTabs() {
  const id = CASE_ORDER[caseState.idx];
  [...caseTabs.children].forEach(b => {
    const active = b.dataset.case === id;
    b.classList.toggle('active', active);
    b.setAttribute('aria-selected', String(active));
    b.tabIndex = active ? 0 : -1;
  });
}

// Switch the single window to another tab with a short fade.
function selectCase(idx, immediate) {
  if (idx < 0 || idx >= CASE_ORDER.length || (!immediate && caseState.animating)) return;
  clearTimeout(caseSwitchTimer);
  if (immediate) {
    caseTrack.classList.remove('switching');
    caseState.idx = idx;
    caseState.animating = false;
    setCardProject(caseCard, CASE_ORDER[idx]);
    updateTabs();
    return;
  }
  caseState.animating = true;
  caseTrack.classList.add('switching');
  caseSwitchTimer = setTimeout(() => {
    caseState.idx = idx;
    setCardProject(caseCard, CASE_ORDER[idx]);
    updateTabs();
    requestAnimationFrame(() => {
      caseTrack.classList.remove('switching');
      caseSwitchTimer = setTimeout(() => { caseState.animating = false; }, 220);
    });
  }, 180);
}

function openCase(id) {
  computeCaseOrder();
  const idx = CASE_ORDER.indexOf(id);
  if (idx < 0) return;
  if (!caseCard) buildCard();
  renderTabs();                                       // reflect current order
  caseModal.classList.toggle('fs', isMobileCase());   // mobile = always fullscreen
  selectCase(idx, true);
  caseModal.classList.add('open');
  caseModal.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
  // next frame so the open->show transition actually animates
  requestAnimationFrame(() => requestAnimationFrame(() => caseModal.classList.add('show')));
  updateTabs();
}

function closeCase() {
  caseModal.classList.remove('show');
  caseModal.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
  const done = () => {
    caseModal.classList.remove('open', 'fs');
    clearTimeout(caseSwitchTimer);
    caseState.animating = false;
    caseTrack.classList.remove('switching');
    caseTrack.querySelector('.case-expand').setAttribute('aria-pressed', 'false');
    // Unload the active page so video and animation work stops behind the closed modal.
    const f = caseCard.querySelector('iframe');
    f.classList.remove('ready');
    f.removeAttribute('src');
    caseModal.removeEventListener('transitionend', done);
  };
  caseModal.addEventListener('transitionend', done);
  // safety net if no transition fires
  setTimeout(() => { if (!caseModal.classList.contains('show')) done(); }, 600);
}

// Homepage navigation is progressive: a normal same-tab activation opens the
// designed case-study window, while the real href remains available for direct
// visits, modified clicks, new tabs, copy-link, and browser context menus.
workEl.addEventListener('click', e => {
  const trigger = e.target.closest('a[data-case]');
  if (!trigger || !workEl.contains(trigger)) return;
  if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  if (trigger.target && trigger.target !== '_self') return;
  const id = trigger.dataset.case;
  if (!CASE_MAP[id]) return;
  e.preventDefault();
  openCase(id);
});

// Top tabs reuse the same window; no neighboring projects are pre-rendered.
caseTabs.addEventListener('click', e => {
  const b = e.target.closest('.case-tab'); if (!b) return;
  const idx = CASE_ORDER.indexOf(b.dataset.case); if (idx < 0 || idx === caseState.idx) return;
  selectCase(idx, false);
});
// Within the window: expand or close.
caseTrack.addEventListener('click', e => {
  if (e.target.closest('.case-expand')) {
    const fs = caseModal.classList.toggle('fs');
    caseTrack.querySelectorAll('.case-expand').forEach(b => b.setAttribute('aria-pressed', String(fs)));
    return;
  }
  if (e.target.closest('.case-close')) { closeCase(); return; }
});
document.getElementById('caseBackdrop').addEventListener('click', closeCase);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && caseModal.classList.contains('open')) closeCase();
});
// Side handles resize the single window width.
// Uses pointer capture so events keep flowing to the handle even when the
// cursor crosses over the iframe (which would otherwise swallow them).
const CASE_MIN_W = 760;
document.querySelectorAll('.case-resize').forEach(h => {
  h.addEventListener('pointerdown', e => {
    e.preventDefault(); e.stopPropagation();
    const shell = document.querySelector('.case-shell');
    const cx = window.innerWidth / 2, startX = e.clientX;
    const maxW = Math.min(window.innerWidth - 48, 1680);
    let dragging = false, pendingX = startX, raf = 0;
    try { h.setPointerCapture(e.pointerId); } catch (_) {}
    const apply = () => {
      raf = 0;
      const w = Math.max(CASE_MIN_W, Math.min(maxW, Math.abs(pendingX - cx) * 2));
      shell.style.width = w + 'px';
    };
    const onMove = ev => {
      pendingX = ev.clientX;
      if (!dragging && Math.abs(ev.clientX - startX) > 4) {
        dragging = true;
        caseModal.classList.add('resizing');
        caseDeck.classList.add('busy');
        shell.style.transition = 'none';
        document.body.style.userSelect = 'none';
      }
      if (dragging && !raf) raf = requestAnimationFrame(apply);
    };
    const onEnd = () => {
      h.removeEventListener('pointermove', onMove);
      h.removeEventListener('pointerup', onEnd);
      h.removeEventListener('pointercancel', onEnd);
      if (raf) cancelAnimationFrame(raf);
      caseModal.classList.remove('resizing');
      caseDeck.classList.remove('busy');
      shell.style.transition = '';
      document.body.style.userSelect = '';
      try { h.releasePointerCapture(e.pointerId); } catch (_) {}
    };
    h.addEventListener('pointermove', onMove);
    h.addEventListener('pointerup', onEnd);
    h.addEventListener('pointercancel', onEnd);
  });
});

renderProjects();

// 数据驱动:优先从磁盘上的 projects.json 加载(Studio 写入后,刷新即生效)
(async function loadFromFile() {
  try {
    const res = await fetch('projects.json', { cache: 'no-store' });
    if (!res.ok) return;
    const data = await res.json();
    if (Array.isArray(data) && data.length) {
      projects.length = 0; data.forEach(p => projects.push(p));
      try { localStorage.setItem(PROJ_KEY, JSON.stringify(projects)); } catch (e) {}
      renderProjects();
    }
  } catch (e) { /* file:// 或文件缺失时,回退到 localStorage / 默认值 */ }
})();

// 实时预览:Studio 编辑器通过 postMessage 推送草稿内容(不落盘,仅预览)
window.addEventListener('message', e => {
  const d = e.data;
  if (d && d.type === 'ink:projects' && Array.isArray(d.projects)) {
    projects.length = 0; d.projects.forEach(p => projects.push(p)); renderProjects();
    if (typeof d.focus === 'number' && workPanels[d.focus]) {
      workPanels[d.focus].scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }
});

/* ---------------- 内容编辑器(草稿工具:#edit 或按 E 打开) ---------------- */
(function setupEditor() {
  const editor = document.getElementById('editor');
  const tabsEl = document.getElementById('editorTabs');
  const bodyEl = document.getElementById('editorBody');
  if (!editor) return;
  let cur = 0;
  const FIELDS = [
    { key: 'eyebrow', label: 'Eyebrow / year' },
    { key: 'title', label: 'Title' },
    { key: 'href', label: 'Link (URL)' },
    { key: 'desc', label: 'Description', area: true },
  ];
  const META = [{ key: 'madeIn', label: 'Made in' }, { key: 'team', label: 'Team' }, { key: 'duration', label: 'Duration' }];

  function open() { editor.classList.add('open'); editor.setAttribute('aria-hidden', 'false'); buildTabs(); buildForm(); }
  function close() { editor.classList.remove('open'); editor.setAttribute('aria-hidden', 'true'); }
  function toggle() { editor.classList.contains('open') ? close() : open(); }

  function buildTabs() {
    tabsEl.innerHTML = '';
    projects.forEach((p, i) => {
      const b = document.createElement('button');
      b.className = 'editor-tab' + (i === cur ? ' active' : '');
      b.textContent = String(i + 1);
      b.title = p.title || ('Project ' + (i + 1));
      b.addEventListener('click', () => { cur = i; buildTabs(); buildForm(); });
      tabsEl.appendChild(b);
    });
  }

  function makeField(f) {
    const wrap = document.createElement('div'); wrap.className = 'ed-field';
    const lab = document.createElement('label'); lab.textContent = f.label; wrap.appendChild(lab);
    const input = f.area ? document.createElement('textarea') : Object.assign(document.createElement('input'), { type: 'text' });
    input.value = projects[cur][f.key] || '';
    input.addEventListener('input', () => { projects[cur][f.key] = input.value; saveProjects(); refreshPanel(cur); });
    wrap.appendChild(input);
    return wrap;
  }

  function buildForm() {
    const p = projects[cur];
    bodyEl.innerHTML = '';
    // 图片
    const imgField = document.createElement('div'); imgField.className = 'ed-field';
    const lab = document.createElement('label'); lab.textContent = 'Hero image'; imgField.appendChild(lab);
    const row = document.createElement('div'); row.className = 'ed-image';
    const thumb = document.createElement('div'); thumb.className = 'ed-thumb';
    if (p.image) thumb.style.backgroundImage = "url('" + p.image.replace(/'/g, '%27') + "')";
    const col = document.createElement('div'); col.className = 'ed-imgcol';
    const url = Object.assign(document.createElement('input'), { type: 'text', placeholder: 'Image URL', value: (p.image && p.image.startsWith('data:')) ? '' : (p.image || '') });
    url.addEventListener('input', () => { p.image = url.value; thumb.style.backgroundImage = p.image ? ("url('" + p.image.replace(/'/g, '%27') + "')") : ''; saveProjects(); refreshPanel(cur); });
    const fileLab = document.createElement('label'); fileLab.className = 'ed-file'; fileLab.textContent = '…or upload a file';
    const file = Object.assign(document.createElement('input'), { type: 'file', accept: 'image/*' });
    file.addEventListener('change', e => {
      const f = e.target.files && e.target.files[0]; if (!f) return;
      const reader = new FileReader();
      reader.onload = () => { p.image = reader.result; thumb.style.backgroundImage = "url('" + String(reader.result).replace(/'/g, '%27') + "')"; url.value = ''; saveProjects(); refreshPanel(cur); };
      reader.readAsDataURL(f);
    });
    col.appendChild(url); col.appendChild(fileLab); col.appendChild(file);
    row.appendChild(thumb); row.appendChild(col); imgField.appendChild(row); bodyEl.appendChild(imgField);
    // 文本
    FIELDS.forEach(f => bodyEl.appendChild(makeField(f)));
    const metaRow = document.createElement('div'); metaRow.className = 'ed-row';
    META.forEach(m => metaRow.appendChild(makeField(m)));
    bodyEl.appendChild(metaRow);
    // 删除
    const rm = document.createElement('button'); rm.className = 'ed-remove'; rm.textContent = 'Remove this project';
    rm.addEventListener('click', () => {
      if (projects.length <= 1) return;
      projects.splice(cur, 1); cur = Math.max(0, cur - 1); saveProjects(); renderProjects(); buildTabs(); buildForm();
    });
    bodyEl.appendChild(rm);
  }

  document.getElementById('editorClose').addEventListener('click', close);
  document.getElementById('editorAdd').addEventListener('click', () => {
    projects.push({ eyebrow: 'Project ' + String(projects.length + 1).padStart(2, '0'), title: 'New project', href: '#', image: '', desc: '', madeIn: '', team: '', duration: '' });
    cur = projects.length - 1; saveProjects(); renderProjects(); buildTabs(); buildForm();
  });
  document.getElementById('editorReset').addEventListener('click', () => {
    if (!confirm('Reset all project content to the built-in defaults?')) return;
    localStorage.removeItem(PROJ_KEY); projects = loadProjects(); cur = 0; renderProjects(); buildTabs(); buildForm();
  });
  document.getElementById('editorExport').addEventListener('click', () => {
    const json = JSON.stringify(projects, null, 2);
    try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' })); a.download = 'projects.json'; a.click(); URL.revokeObjectURL(a.href); } catch (e) {}
    if (navigator.clipboard) navigator.clipboard.writeText(json).catch(() => {});
  });

  if (location.hash === '#edit') open();
  window.addEventListener('keydown', e => {
    const t = (e.target && e.target.tagName) || '';
    if (e.key === 'Escape' && editor.classList.contains('open')) { close(); return; }
    if ((e.key === 'e' || e.key === 'E') && !/INPUT|TEXTAREA/.test(t) && !e.metaKey && !e.ctrlKey && !e.altKey) toggle();
  });
})();

let lastTime = performance.now();
const bootStart = window.__splashBootAt || lastTime;

// ── Loading veil reveal ──────────────────────────────────────────────────────
// Fade the splash once the landing has actually painted a few frames (and a short
// minimum has elapsed so it never just flashes). Covers the shader-compile + first
// warm frames where weak GPUs hitch.
let paintedFrames = 0, splashGone = false;
function revealSite() {
  if (splashGone) return;
  splashGone = true;
  if (typeof window.__dismissSplash === 'function') {
    window.__dismissSplash();
    return;
  }
  const s = document.getElementById('splash');
  if (!s) return;
  s.classList.add('hide');
  s.addEventListener('transitionend', () => s.remove(), { once: true });
  setTimeout(() => { if (s.parentNode) s.remove(); }, 450);   // fallback (just past the 300ms fade)
}

// ── Adaptive perf monitor ────────────────────────────────────────────────────
// Watch raw frame intervals; if the median stays slow on a *visible* tab, step the
// quality tier down once and re-measure. Gated on visibility so a backgrounded tab
// (rAF throttled to ~1fps) can never trigger a spurious downscale.
let perfSamples = [], perfWindowStart = -1;
function monitorPerf(now, rawMs) {
  if (tierIndex >= TIERS.length - 1) return;                 // already lowest
  if (document.visibilityState !== 'visible') { perfSamples.length = 0; perfWindowStart = -1; return; }
  if (perfWindowStart < 0) { perfWindowStart = now; return; }
  if (now - perfWindowStart < 800) return;                   // warm-up grace
  perfSamples.push(rawMs);
  if (perfSamples.length < 40) return;
  perfSamples.sort((a, b) => a - b);
  const median = perfSamples[perfSamples.length >> 1];
  perfSamples.length = 0; perfWindowStart = now;
  if (median > 22) applyTier(tierIndex + 1);                 // sustained < ~45fps → ease off
}

function update(now) {
  const rawMs = now - lastTime;
  const dt = Math.min(rawMs / 1000, 1 / 20);
  lastTime = now;
  simTime += dt;

  // The dedicated liquid landing owns the frame; pause the legacy fluid simulation.
  if (!landingActive) {
    monitorPerf(now, rawMs);

    if (resizeCanvas()) {
      if (inkReady) initFramebuffers();
      if (crystalReady) initCrystalSystem();   // 晶体随尺寸重建
      buildObstacle();
      rebuildParticles();    // 断点变化时,粒子数量随视口重建(否则空转)
    }

    if (mode === 'crystal') {
      applySeeds();
      crystalStep();
      renderCrystal();
    } else if (mode === 'particle') {
      // 粒子:自给自足,无需流体
      particleStep(dt);
      renderParticles();
    } else {
      // ink 流体
      emitTrace(dt);
      applyInputs();
      step(dt);
      render();
    }
  }

  // Hold the veil until landing-liquid.js reports its first rendered frame.
  if (!splashGone && !(landingActive && !landingReady)) {
    paintedFrames++;
    if (paintedFrames >= 4 && now - bootStart > 450) revealSite();
  }
  requestAnimationFrame(update);
}
requestAnimationFrame(update);
</script>
